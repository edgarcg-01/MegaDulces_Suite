<router-outlet></router-outlet>
<p-confirmdialog></p-confirmdialog>
<!-- Fuera del router: una excepción puede haber dejado la navegación inservible. -->
<app-error-outlet />

<!-- [MS.AVISO] Solicitud nueva en la Mesa de Servicio: en la raíz para que salga en cualquier
     pantalla con sesión, también en «Mi trabajo», que no usa el layout. -->
@if (sesionAbierta() && !enRutaPublica()) {
  <app-service-desk-aviso-toast />
}

<!-- SM.23 — "Haz tu arqueo". Barra fija, no toast: en una caja con clientes
     enfrente, un aviso que se va solo a los 5 segundos no lo ve nadie. Se apaga
     cuando entra a contar. -->
@if (arqueoDue.pendiente(); as a) {
  <button type="button" class="app-arqueo" [class.vencido]="a.vencido" (click)="irAlArqueo()">
    <i class="pi pi-bell" aria-hidden="true"></i>
    <span>
      @switch (a.motivo) {
        @case ('retiro') { <b>Cuenta el retiro</b> }
        <!-- SM.40 — Kepler abrió la caja. Es un aviso de que YA SE PUEDE contar,
             no de que haya que hacerlo ahora: el arqueo dejó de tener horario. -->
        @case ('apertura') { <b>Tu caja está abierta</b> }
        @default { <b>Haz tu arqueo</b> }
      }
      · Caja {{ a.caja }}@if (a.motivo === 'apertura') {
        @if (a.hora_apertura) { · abrió {{ a.hora_apertura.slice(0,5) }} }
      } @else if (a.hora_cierre) { · cerró {{ a.hora_cierre.slice(0,5) }} }
      <!-- Dos cortes al día es lo normal (mediodía y cierre): si falta más de uno
           hay que decirlo, o al terminar el primero cree que ya acabó. -->
      @if (arqueoDue.cuantos() > 1) { <em>· te faltan {{ arqueoDue.cuantos() }}</em> }
    </span>
  </button>
}

<!-- ⛔ [SW.2] ACÁ VIVÍA EL BOTÓN «Hay una versión nueva · Actualizar», y se retiró por pedido
     de Edgar (2026-10-20): aparecía después de cada despliegue y había que atenderlo.

     Lo que NO se hizo: borrarlo y ya. Eso deja a la gente corriendo la versión vieja sin una
     sola señal, y justo después de un hotfix —que es cuando más importa que todos tengan el
     código nuevo— nadie se enteraría. La pantalla estaría afirmando ser la versión actual sin
     serlo (ESTANDAR_DE_INTERFACES §1).

     Lo que se hizo: la versión nueva se aplica sola cuando la pestaña DEJA DE ESTAR A LA VISTA.
     Ahí nadie está mirando ni tecleando, así que no hay nada que interrumpir, y se vuelve a una
     app ya fresca. Ver `setupAutoUpdate()` en app.component.ts. -->
