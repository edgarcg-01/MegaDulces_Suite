# ═══════════════════════════════════════════════════════════════════════════════════════════
# `[OBS.7]` EL COLECTOR DE DOCKER, APAGADO — se comía 5.5 de los 8 núcleos de `md`
#
# ── Qué pasaba ────────────────────────────────────────────────────────────────────────────
# Medido el 2026-10-02 con prueba negativa (parar netdata 20 s y volver a medir), ventanas de
# 10 s reales sobre `/proc/<pid>/stat`, no el promedio de vida de `ps`:
#
#     netdata corriendo   ->  containerd 196%   dockerd  88%      (pico medido: 298% y 255%)
#     netdata detenido    ->  containerd   0%   dockerd   0%
#     netdata con esto    ->  containerd   1%   dockerd   1%
#
# Y con eso la carga de la máquina pasó de 9–12 a 4.2, y el CPU de 64 °C a 48 °C.
#
# ── Por qué ───────────────────────────────────────────────────────────────────────────────
# El colector pide `GET /images/json` una vez por minuto, con timeout de 2 s. Con ~24 GB de
# imágenes en el almacén de Docker, containerd tiene que recorrer el snapshotter para calcular
# el tamaño desempacado de CADA una, y eso tarda **más de un minuto** → la siguiente petición
# entra antes de que termine la anterior, se encadenan, y el par dockerd+containerd queda
# moliendo para siempre. En el diario de `docker` se ve el síntoma exacto:
#
#     status=499 "request cancelled by client"  +  "snapshotter.Usage failed ... context canceled"
#
# ⚠️ Ojo con la trampa de medición: a **1 llamada por minuto** el ritmo parece inofensivo, y por
#    eso descarté esta hipótesis una vez antes de comprobarla. Lo que la vuelve cara no es la
#    frecuencia, es que **cada llamada dura más que el intervalo**. `collect_container_size: no`
#    ya estaba puesto y NO alcanza: ese ajuste evita medir los contenedores, no las imágenes.
#
# ⭐ Y lo que este colector mira HOY no vale nada: prod se mudó a k3s el 2026-09-22. En Docker
#    sólo quedan 5 contenedores triviales (registry, backup, dozzle, autoheal y el propio
#    netdata), **todos al 0%**. La carga real vive en `kubepods`, que netdata sigue viendo por
#    cgroups — verificado después del cambio: **4,896 series de k8s** presentes. No se pierde
#    nada de lo que importa.
#
# ⛔ Si alguna vez prod vuelve a Compose, NO basta con volver a encender esto: primero hay que
#    podar el almacén de imágenes, o vuelve el mismo encadenamiento.
# ═══════════════════════════════════════════════════════════════════════════════════════════
enabled: yes
default_run: yes
modules:
  docker: no
