# ─────────────────────────────────────────────────────────────────────────────
# `[OBS.7]` OBSERVABILIDAD DE `md` — lo que Railway daba y on-prem no existía.
#
# Medido el 2026-09-24 en `md`: CERO. Ni logs centralizados ni métricas. Para ver por qué un
# contenedor se cayó había que entrar por ssh y leer `docker logs` uno por uno — que es
# exactamente lo que se hizo todo el día de hoy, a mano, cuatro veces.
#
# ⛔ SE ELIGE LIVIANO A PROPÓSITO, y el número manda: al montarlo la máquina tenía **8.4 GB de
# RAM disponibles de 28.8** y carga ~4 sobre 8 hilos, con TRES Postgres encima (17 bases, 82 GB).
# Un Prometheus + Grafana + cAdvisor + exporters son 4-5 contenedores y ~500 MB para mirar una
# máquina que ya va apretada: el monitoreo se comería lo que vino a vigilar.
#
#   · `netdata` — CPU/RAM/disco/red por contenedor y del host, más los tres Postgres. ~200 MB.
#
# ── ⛔ `[OBS.8]` EL VISOR DE LOGS SE FUE DE ACÁ (2026-10-06) ─────────────────────────────────
# Este archivo declaraba un segundo servicio, `dozzle` (`obs-dozzle`, puerto 8085). Se retiró, y
# el motivo es que **se había quedado sin sujeto**: lee el socket de Docker, y producción dejó de
# correr en Docker el 2026-10-02, cuando se mudó a k3s (containerd). Medido antes de sacarlo, los
# 7 contenedores que listaba eran `sonar-server`, `sonar-db`, `obs-netdata`, `prod-registry`,
# `prod-backup`, `ods-autoheal` y él mismo — **ni una sola línea de la aplicación**.
#
# ⭐ Y había quedado al revés de lo que conviene: la instancia CON llave (la de k3s,
# `ops/k3s/60-dozzle.deployment.yaml`, `DOZZLE_AUTH_PROVIDER=simple`) era la que mostraba prod, y
# la ABIERTA era ésta, que no mostraba nada de prod. Verificado el día que se retiró:
# `:8085` contestaba **HTTP 200 sin login** y `:30085` contestaba **307** al login.
#
# El visor vive ahora SÓLO en k3s: http://192.168.0.222:30085
# Los logs de estos 7 laterales se leen con `docker logs <nombre>` por ssh, que es lo que se hacía
# antes de que existiera y alcanza para un contenedor que nadie mira a diario. Si algún día se
# quieren los dos mundos en una pantalla, el camino es el MODO AGENTE de Dozzle v11 (este pasa a
# `DOZZLE_MODE=agent` sin publicar puerto y el de k3s lo consume) — ⚠️ sin verificar que una
# instancia en modo `k8s` pueda además consumir un agente remoto; comprobarlo antes de intentarlo.
#
# ⚠️ SÓLO LAN. No va por el túnel de Cloudflare ni tiene ruta en Caddy, a propósito. Se llega por
#    `192.168.0.222:<puerto>` igual que al Postgres del 5434, que es la frontera de confianza que
#    esta red ya usa.
#
# ⚠️ DEUDA DECLARADA, no resuelta: **netdata sigue sin autenticación**. Cualquiera en la LAN que
#    sepa el puerto lo abre. Retirar Dozzle cerró el agujero de los logs, NO éste: las métricas
#    exponen nombres de base, de contenedor y de tablas. Queda pendiente con nombre.
#
#   despliegue:  scp ops/obs/docker-compose.yml superoot@192.168.0.222:~/ops/obs/
#                ssh superoot@192.168.0.222 'cd ~/ops/obs && docker compose -p obs up -d --remove-orphans'
#                ⛔ `--remove-orphans` NO es opcional desde que este archivo tiene UN servicio:
#                sin él, `up -d` deja a `obs-dozzle` corriendo aunque ya no esté declarado — que
#                es exactamente cómo un contenedor sobrevive a su propia eliminación del repo.
#                (no hay `deploy.sh` acá a propósito: es un contenedor sin construcción, sin
#                 secretos y sin orden de arranque — un script sería una capa que ocultar)
#   logs:        http://192.168.0.222:30085   (en k3s, con login)
#   métricas:    http://192.168.0.222:19999
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LAS MÉTRICAS ────────────────────────────────────────────────────────────
  # ⚠️ Los montajes de `/proc`, `/sys` y `/etc/os-release` NO son opcionales: sin ellos Netdata
  # mide el CONTENEDOR, no la máquina, y reporta una caja de 200 MB perfectamente sana mientras
  # el host está al borde del swap. Es la misma clase de mentira que este proyecto persigue todo
  # el día — un rótulo verde sobre el sujeto equivocado.
  netdata:
    image: netdata/netdata:stable
    container_name: obs-netdata
    restart: unless-stopped
    hostname: md
    pid: host
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    environment:
      TZ: America/Mexico_City
      # Retención corta: esto es para VER qué está pasando, no un almacén histórico. La serie
      # larga, si algún día hace falta, va a Prometheus — y entonces se paga lo que cuesta.
      NETDATA_EXTRA_DEB_PACKAGES: ""
      DO_NOT_TRACK: "1"
    volumes:
      - netdata-config:/etc/netdata
      # ⛔ `[OBS.7]` VA DESPUÉS del volumen `netdata-config` a propósito: lo monta ENCIMA, así la
      # config queda declarada en el repo y no escondida dentro de un volumen de la máquina.
      # Apaga el colector de Docker, que se comía 5.5 de los 8 núcleos. El motivo completo y la
      # prueba negativa están en el propio archivo — leerlo antes de volver a encenderlo.
      - ./go.d.conf:/etc/netdata/go.d.conf:ro
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "19999:19999"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    mem_limit: 400m

volumes:
  netdata-config:
  netdata-lib:
  netdata-cache:
