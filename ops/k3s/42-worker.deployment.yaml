# ═══ WORKER — el singleton de los 51 @Cron ═══  [K3S.28]
#
# ⭐ VIVE EN SU PROPIO ARCHIVO, y no es cosmética: `aplicar-k3s-prod.sh` filtra POR ARCHIVO, y
# `npm run check:k3s` exige que un archivo no mezcle `migrado` con `preparado`. Mientras el
# worker estaba junto a `redis` y `api` —que siguen en Compose— no se podía migrar sin
# arrastrarlos. Un archivo = una unidad de migración.
#
# ⛔ SIN `REDIS_URL` Y SIN EL initContainer QUE ESPERABA A REDIS, y eso se MIDIÓ antes de
# quitarlo, no se asumió:
#
#   · `redis-cli client list` sobre el redis de prod, con el worker llevando ~5 h arriba y
#     51 @Cron corriendo: los únicos clientes eran `prod-api` y el propio redis. El worker
#     NO tenía ni una conexión.
#   · `app.module.ts:387` → `const store = url ? createKeyv(url) : new Keyv()`. Con
#     `REDIS_URL` la caché es de Redis; sin él, en memoria. Keyv conecta de forma PEREZOSA,
#     así que cero conexiones en cinco horas significa cero operaciones de caché.
#   · El adaptador de socket.io es cosa del API: el worker arranca `bootstrapWorker`, sin
#     HTTP ni WS.
#
# ⚠️ Lo que se pierde y queda DECLARADO: si algún día un @Cron invalidara una clave de caché,
# el API no se enteraría. Hoy eso no pasa —medido—, pero si pasara sería silencioso. El día
# que `redis` y `api` migren, basta con devolverle `REDIS_URL` apuntando al Service del
# clúster. Dejarlo apuntando a un Service SIN endpoints sería peor: fallaría al primer uso.
#
# ⛔ `replicas: 1` + `Recreate` NUNCA se tocan: son 51 @Cron. Dos pods = cada tarea dos veces,
# y el solape de RollingUpdate alcanza para duplicar una escritura.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: prod
  labels: { app: worker, singleton: "true", migracion: migrado }
spec:
  replicas: 1             # ⛔ NUNCA subir: son 51 @Cron, dos pods = cada uno dos veces
  strategy:
    type: Recreate        # ⛔ RollingUpdate solaparía dos workers durante el despliegue
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      # ⭐ [DEPLOY.1] 90 s — Y EL 600 DE LA PRIMERA VERSIÓN ERA UNA REGRESIÓN. Medido, no opinado.
      #
      # EL PROBLEMA ORIGINAL SIGUE SIENDO CIERTO: acá no había nada, el default de Kubernetes es
      # 30 s, y de 90 jobs con latido **27 pasan de 30 s** (`analytics.cron_runs`, prod,
      # 2026-10-13). Un despliegue que los agarre corriendo los mata a media transacción.
      #
      # ── ⛔⛔ PERO 600 ROMPÍA EL DESPLIEGUE, Y DE FORMA DETERMINISTA ────────────────────────
      #
      # `aplicar-k3s-prod.sh` espera la convergencia **150 s** (`_fin = now + 150`). Con 600 de
      # gracia el worker puede tardar 600 en morir, así que la ventana se agota SIEMPRE:
      #
      #     [11:07:42] ⛔ se agotó la ventana con estos sin converger: worker
      #     [11:07:42] vigía: el despliegue salió con 1 — no reintento
      #
      # Falló 2 de 2 despliegues antes de que alguien lo mirara, y el vigía NO reintenta.
      #
      # ⭐ Y la razón de que se pague SIEMPRE: **el worker no sale solo con SIGTERM** — hay que
      # matarlo. Verificado en su log: `SchedulerOwnership` imprime `detenidos 0 crons` porque
      # NestJS ya desmontó `ScheduleModule` antes de ese hook (o sea que el hook es REDUNDANTE,
      # el framework ya paraba los crons). Lo que mantiene vivo el proceso es otra cosa —
      # pg-boss, el pool, sockets abiertos. Como nunca termina por su cuenta, la gracia no es
      # "hasta que acabe": es **tiempo fijo hasta el SIGKILL**, y se cobra entero en cada
      # despliegue, haya o no un job corriendo.
      #
      # ── POR QUÉ 90 ────────────────────────────────────────────────────────────────────────
      #
      # Entra cómodo en los 150 s de la ventana (60 s de margen para que roten los otros
      # deployments) y triplica la protección del default. Cubre los jobs de hasta ~90 s.
      #
      # ⛔ LO QUE 90 **NO** ARREGLA, Y SE DECLARA EN VEZ DE DISIMULARSE: de los 27 jobs que
      # pasan de 30 s, **25 pasan de 60** — así que la mayoría sigue sin protección. Con una
      # ventana de 150 s y `Recreate`, un job de minutos NO se puede proteger con la gracia,
      # punto. Las salidas de verdad son otras tres, y ninguna es subir este número:
      #   1. que el worker SALGA al terminar (hoy nunca sale → la gracia se paga siempre);
      #   2. que los jobs largos sean idempotentes/reanudables (los REFRESH ya lo son);
      #   3. no desplegar en la ventana de los refrescos largos (06:20–07:59 MX).
      terminationGracePeriodSeconds: 90
      # ⛔ [K3S.28] ACÁ HABÍA UN initContainer QUE ESPERABA A REDIS, y se quitó MIDIENDO.
      #
      # Lo puso [K3S.18] para reemplazar al `depends_on: condition: service_healthy` de Compose,
      # después de que su ausencia mordiera de verdad: el API ganó la carrera, pidió Redis,
      # recibió ECONNREFUSED y su adaptador de socket.io se quedó in-memory PARA SIEMPRE.
      #
      # ⭐ Pero esa lección es del API, no del worker, y copiarla acá era conservar la FORMA sin
      # la razón. El worker no habla con Redis (ver la cabecera del archivo), así que este
      # initContainer sólo garantizaba una cosa: que el worker NO ARRANCARA mientras `redis`
      # siga en Compose, porque el Service del clúster no tiene endpoints. Un guardia que no
      # protege nada y bloquea el arranque.
      containers:
        - name: worker
          image: localhost:5000/trade-prod-worker:__COMMIT__
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: prod-env }
          env:
            - { name: TZ,                     value: America/Mexico_City }
            - { name: NODE_ENV,               value: production }
            - { name: WORKER,                 value: "true" }
            - { name: ENABLE_WORKER_QUEUE,    value: "true" }
            - { name: RUN_MIGRATIONS_ON_BOOT, value: "0" }
            # ═══ [CG.190] El autollenado de Caja General ═══
            #
            # ⛔⛔ APAGADO A PROPÓSITO. Es el único @Cron del worker que ESCRIBE DINERO en el
            #   libro sin que nadie mire, así que su default en código también es apagado y
            #   acá queda explícito para que la perilla se VEA. Prenderlo es decisión de
            #   Edgar, no efecto colateral de un despliegue.
            #
            # ── Antes de ponerlo en "true", las tres cosas que tienen que estar ────────────
            #   1. La migración `20261016105305` APLICADA (la cuenta de servicio
            #      `svc_caja_autollenado`). Sin ella cada movimiento automático queda firmado
            #      por un UUID que la pantalla no resuelve a un nombre.
            #   2. Una corrida en SIMULACIÓN mirada por alguien:
            #      `POST /finance/cash-ledger/autollenado/correr` (sin `?aplicar=1`) —
            #      contesta qué haría sin escribir una fila.
            #   3. Una corrida real acotada, y `node database/tests/test-newdb-caja-autollenado.js`
            #      en verde (sus aserciones [6], [7] y [8] sólo se ejercen cuando ya escribió).
            #
            # ⭐⭐ PRENDIDO desde el 2026-10-19, y el default cambió A PROPÓSITO.
            #
            #   Nació en "false" porque el motor no se había ejercido nunca contra base real.
            #   Ya se ejerció: su primera corrida escribió 43 movimientos por $504,101.68 y las
            #   43 cuadran AL CENTAVO contra su documento de Kepler (30 pagos + 1 cobro contra
            #   analytics.mv_caja_movimientos; 12 cobros de ruta contra el GRUPO de
            #   analytics.route_collections). La condición para prenderlo se cumplió.
            #
            # ⛔ Y se declara acá, en el manifiesto, por una razón MEDIDA: un `kubectl set env`
            #   lo prende hasta el próximo despliegue, que vuelve a aplicar este archivo y lo
            #   apaga EN SILENCIO. Pasó dos veces el 2026-10-19 — es el mismo mecanismo de
            #   [CG.192]. Lo que no está acá, no sobrevive.
            #
            # ⚠️ [CG.197] Ya NO hay reloj: el motor escucha `NOTIFY caja_movimientos` y corre
            #   cuando el carril avisa que entraron documentos. Por eso el umbral de `CRON_JOBS`
            #   subió a 30 h / 72 h: quedarse quieto un domingo es legítimo.
            - { name: ENABLE_CAJA_AUTOLLENADO, value: "true" }
            # El piso de alcance: decisión de Edgar del 2026-10-16 ("del día 10 para adelante,
            # todo lo anterior ya debería estar conciliado" en el Access). ⛔ Moverlo HACIA ATRÁS
            # es una decisión contable, no de operación: antes del 10-oct hay 13,206 movimientos
            # por $162,080,748.92 que ya están conciliados del otro lado.
            - { name: CAJA_AUTOLLENADO_PISO, value: "2026-10-10" }
            # [K.VEC.2] 2026-10-16 - el corpus vectorial se recreo desde cero (pg-rag quedo
            #   vacio en la mudanza a md del 22-sep; ver GOTCHAS §83). Aplicado en el cluster
            #   por Edgar a las 09:57 con `kubectl set env`; este valor es el mismo, para que
            #   el proximo `kubectl apply` no lo baje en silencio.
            #
            # ⭐ Por que 11000 y no 200: el limitador NUNCA fue el trabajo, era el calendario.
            #   Medido en el tick de las 08:30: 400 embeddings en 8.9 s y despues 891 s de
            #   espera -- el worker ocupado el 1% del tiempo, y 13 h de reloj para ~8 min de
            #   computo. Peor, cada tick relee las ~11,000 filas de la fuente ANTES de embeber
            #   sus 200: a batch chico ese escaneo se repite 55 veces para el mismo resultado.
            #   Con 11000 el arranque en frio entra en UN tick.
            #
            # ⚠️ Esto es tamano de ARRANQUE EN FRIO, no de regimen. En estado estacionario el
            #   tick solo procesa los stale (un punado de altas y renombres), asi que el valor
            #   alto no cuesta nada: `staleAll` ya viene casi vacio y no se llama a Voyage.
            #   El guard `isRunning` cubre el unico riesgo real (que un tick largo se solape
            #   con el siguiente): el segundo se saltea, no se encima.
            - { name: VECTOR_SYNC_TICK_BATCH,  value: "11000" }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "2Gi" }
