# ═══ RECONCILIADOR NOCTURNO ═══  [K3S.3]  — el molde de los trabajos agendados
#
# ⛔ TRES TRAMPAS, y las tres se midieron en ESTE sistema, no se leyeron en un blog.
#
# 1. `concurrencyPolicy: Forbid` — el default de un CronJob es **`Allow`**: si una corrida se
#    pasa de la hora de la siguiente, K8s levanta la segunda ENCIMA. Dos reconciliadores a la vez
#    propagando DELETE sobre las mismas tablas es la peor forma de esta familia de fallas. La
#    corrida del 2026-10-01 tardó 1 min, pero una pasada `--full` sobre `kdm2` (1.8 M filas en la
#    rama 03) no tiene techo garantizado.
#
# 2. ⛔ NADA DE `livenessProbe` DE ENTREGA ACÁ, y NADA de `activeDeadlineSeconds` a ojo.
#    Es el footgun canónico y ya cobró: `ods-reconcile-full` acumuló **505 reinicios en 7 días**
#    (300 en un solo día) porque su healthcheck de ENTREGA mataba al proceso que producía justo
#    lo que el healthcheck exigía — el latido sólo se escribe al TERMINAR, y el chequeo lo mataba
#    antes. Se arregló cambiándolo a `pidof crond`. `activeDeadlineSeconds` repite el error
#    exacto en otro campo: mata el Job a mitad y el siguiente empieza de cero.
#    → Un Job **no lleva liveness**: termina o falla, y eso ya es la señal.
#
# 3. `backoffLimit: 0` — el default es 6. Un reintento automático de un job que propaga DELETE
#    es otra corrida completa sobre el mismo estado. Si falló, se mira; no se reintenta solo.
#
# ⭐ Y UNA GANANCIA REAL, que hoy costó caro: `failedJobsHistoryLimit` conserva el pod de las
#    corridas FALLIDAS, así que sus logs sobreviven. El 2026-10-01 el nocturno falló a las 02:10
#    y perdí la evidencia por recrear el contenedor de Compose para desplegar — en K8s el Job
#    fallido habría quedado ahí para mirarlo.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ods-reconcile-full
  namespace: ingesta
  labels:
    carril: ods-reconcile-full
    singleton: "true"
spec:
  schedule: "10 2 * * *"
  timeZone: "America/Mexico_City"   # ⚠️ sin esto corre en UTC = 20:10 MX. En Compose el mismo
                                    # defecto se evitó instalando tzdata (`[VL.4]`, trampa 2).
  concurrencyPolicy: Forbid         # ⛔ el default es Allow: ver el encabezado
  startingDeadlineSeconds: 3600     # si el nodo estuvo caído a las 02:10, corre hasta las 03:10
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5         # ⭐ los logs de lo que falló SOBREVIVEN
  jobTemplate:
    spec:
      backoffLimit: 0               # ⛔ el default es 6: ver el encabezado
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconciliador
              image: trade-ingest:latest
              imagePullPolicy: IfNotPresent
              command:
                - node
                - database/importers/kepler/reconcile-ods-window.js
                - --full
                - --delete-sobrantes
                - --apply                      # ⛔ sin esto NO late ([OBS.13]) y el carril
                                               #    quedaría mudo mientras parece que corre
                - --tables=kdpord,kdm2,kdij
              envFrom:
                - secretRef:
                    name: ingest-env
              env:
                - name: ODS_RECONCILE_HB_KEY
                  value: cdc_reconcile_full     # ⛔ propia: sin ella pisa el renglón de OTRO carril
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits:   { memory: "1Gi" }
