# ═══ RECONCILIADOR NOCTURNO ═══  [K3S.3]  — el molde de los trabajos agendados
#
# ⛔ TRES TRAMPAS, y las tres se midieron en ESTE sistema, no se leyeron en un blog.
#
# 1. `concurrencyPolicy: Forbid` — el default de un CronJob es **`Allow`**: si una corrida se
#    pasa de la hora de la siguiente, K8s levanta la segunda ENCIMA. Dos reconciliadores a la vez
#    propagando DELETE sobre las mismas tablas es la peor forma de esta familia de fallas. La
#    corrida del 2026-10-01 tardó 1 min, pero una pasada `--full` sobre `kdm2` (1.8 M filas en la
#    rama 03) no tiene techo garantizado.
#
# 2. ⛔ NADA DE `livenessProbe` DE ENTREGA ACÁ, y NADA de `activeDeadlineSeconds` a ojo.
#    Es el footgun canónico y ya cobró: `ods-reconcile-full` acumuló **505 reinicios en 7 días**
#    (300 en un solo día) porque su healthcheck de ENTREGA mataba al proceso que producía justo
#    lo que el healthcheck exigía — el latido sólo se escribe al TERMINAR, y el chequeo lo mataba
#    antes. Se arregló cambiándolo a `pidof crond`. `activeDeadlineSeconds` repite el error
#    exacto en otro campo: mata el Job a mitad y el siguiente empieza de cero.
#    → Un Job **no lleva liveness**: termina o falla, y eso ya es la señal.
#
# 3. `backoffLimit: 0` — el default es 6. Un reintento automático de un job que propaga DELETE
#    es otra corrida completa sobre el mismo estado. Si falló, se mira; no se reintenta solo.
#
# ⭐ Y UNA GANANCIA REAL, que hoy costó caro: `failedJobsHistoryLimit` conserva el pod de las
#    corridas FALLIDAS, así que sus logs sobreviven. El 2026-10-01 el nocturno falló a las 02:10
#    y perdí la evidencia por recrear el contenedor de Compose para desplegar — en K8s el Job
#    fallido habría quedado ahí para mirarlo.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ods-reconcile-full
  namespace: ingesta
  labels:
    carril: ods-reconcile-full
    singleton: "true"
    migracion: migrado              # [K3S.45] 2026-10-02: era el ULTIMO carril en Compose
spec:
  schedule: "10 2 * * *"
  timeZone: "America/Mexico_City"   # ⚠️ sin esto corre en UTC = 20:10 MX. En Compose el mismo
                                    # defecto se evitó instalando tzdata (`[VL.4]`, trampa 2).
  concurrencyPolicy: Forbid         # ⛔ el default es Allow: ver el encabezado
  startingDeadlineSeconds: 3600     # si el nodo estuvo caído a las 02:10, corre hasta las 03:10
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5         # ⭐ los logs de lo que falló SOBREVIVEN
  jobTemplate:
    spec:
      backoffLimit: 0               # ⛔ el default es 6: ver el encabezado
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconciliador
              image: localhost:5000/trade-ingest:__COMMIT__
              imagePullPolicy: IfNotPresent
              command:
                - node
                - database/importers/kepler/reconcile-ods-window.js
                - --full
                - --delete-sobrantes
                - --apply                      # ⛔ sin esto NO late ([OBS.13]) y el carril
                                               #    quedaría mudo mientras parece que corre
                - --tables=kdpord,kdm2,kdij
              envFrom:
                - secretRef:
                    name: ingest-env
              env:
                - name: ODS_RECONCILE_HB_KEY
                  value: cdc_reconcile_full     # ⛔ propia: sin ella pisa el renglón de OTRO carril
                # ⛔⛔ [OBS.14] SIN ESTO, SUBIR EL LÍMITE DE MEMORIA NO SIRVE DE NADA.
                #
                # Node fija su heap en ~LA MITAD del límite del cgroup. Con `limits: 1Gi` V8 se
                # tope en ~520 MB y el proceso moría de SU PROPIO techo, no del contenedor — por
                # eso el kernel no registraba ningún OOM (verificado: 0 eventos en 3 días) y el
                # pod salía con 139. Reproducido en seco tres veces, siempre a los ~30 s:
                #
                #   FATAL ERROR: Reached heap limit Allocation failed - JS heap out of memory
                #   ... 513.0 (526.4) MB
                #
                # Si sólo se sube `limits` a 4Gi, V8 queda en ~2 GB; y si sólo se sube esto por
                # encima del límite, el V8 abort se convierte en un OOM del kernel. Van juntos.
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=3072"
              # ⭐ [OBS.14] 1Gi → 4Gi, y el número NO es al tanteo: con 5Gi/4096 la corrida
              # TERMINÓ y el pico real medido fue **1,513 Mi**. 4Gi deja ~2.6× de margen sobre
              # ese pico, que hace falta porque el universo crece: `--full` compara 7.36 M de
              # llaves (kdm2 5,053,929 + kdij 2,155,440 + kdpord 149,996) × 9 ramas en un Set.
              #
              # ⚠️ No fue un cambio de código: este trabajo corrió **25 veces OK** y su última
              # corrida buena fue el **2026-10-01 08:55**. Cruzó el techo por crecimiento. El día
              # que vuelva a fallar con 139, el número a mirar es el pico, no el código.
              #
              # ⭐ El arreglo de fondo es otro y queda declarado: la comparación es entre dos
              # Postgres y se hace trayendo 7.36 M de llaves a un `Set` de Node. Hacerla en SQL
              # —o trocear por rama, que baja el universo a ~560 k— la volvería insensible al
              # crecimiento. Subir la memoria compra tiempo, no resuelve la forma.
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits:   { memory: "4Gi" }
---
# ═══ [K3S.45] EL SEGUNDO TRABAJO, QUE CASI SE PIERDE EN LA MUDANZA ═════════════════════════
#
# ⛔ El contenedor de Compose corria DOS entradas de cron (ops/vl/crontab.reconcile-full) y
# este manifiesto habia traido UNA. Migrarlo asi habria dejado de correr `cdc_dedupe_fecha`
# EN SILENCIO: su renglon de analytics.cron_runs no se pondria en error, simplemente dejaria
# de avanzar -- y una fila vieja se lee como "todavia no corrio", no como "ya no corre".
#
# ⭐ Es el mismo defecto que el `command` perdido de los Postgres ([K3S.42]), una capa mas
# arriba: el manifiesto reemplazo al contenedor pero no a su AGENDA. Lo que se copia mirando
# el servicio deja afuera lo que vive en un archivo que el servicio lee.
#
# ⚠️ Necesita `sh -c` y no `command:` directo, porque la lista de tablas se calcula en el
# momento: son los kdc2YYMM de los ultimos cuatro meses, y el nombre cambia cada mes.
#
# ⭐ `[OPS-AUD.12]` (2026-10-27) TAMBIEN BORRA SOBRANTES. Cuando Contabilidad cambia la CUENTA de
# un renglon de poliza, la cuenta es parte de la PK: el ODS lo recibe como renglon NUEVO y el
# viejo se queda (118 renglones de sobra jun-sep, todos de las correcciones del SUA). El dedup
# por hora no los ve: su llave por dia NO existe en el origen, asi que no son duplicados sino
# sobrantes. Frenos: comparacion contra la tabla COMPLETA del replica (--full), tope
# MAX_DELETE_FRAC por tabla x sucursal, y nunca borra si el replica devuelve 0 filas.
# ⛔ Antes de encenderlo se corrigio que el camino de sobrantes mandaba la fecha de la PK como
#    Date de JS: borraba la copia de las 06:00 al pedir la de las 00:00 (lib/ods-pk.js).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ods-dedupe-fecha
  namespace: ingesta
  labels:
    carril: ods-dedupe-fecha
    singleton: "true"
    migracion: migrado
spec:
  schedule: "25 2 * * *"
  timeZone: "America/Mexico_City"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: deduplicador
              image: localhost:5000/trade-ingest:__COMMIT__
              imagePullPolicy: IfNotPresent
              # ⭐ `[OPS-AUD.13.4]` Y DESPUÉS, EL ÁRBITRO POR IMPORTE (`arbitro_polizas_valor`). Lo de
              # arriba compara LLAVES; el 2026-10-28 el drenador de la cola borró 1,590 renglones
              # editados (~$17 M) con todo en verde y nada lo vio. El árbitro compara llave +
              # cargo/abono + importe de TODAS las kdc2YYMM × 9 sucursales (~5 s), re-encola lo que
              # difiere y late en rojo. Va DESPUÉS del dedup a propósito: mide lo que los limpiadores
              # no arreglaron. Late por su cuenta; el código de salida del Job sigue siendo el del dedup
              # salvo que éste pase y el árbitro truene.
              command: ["sh", "-c"]
              args:
                - >-
                  node database/importers/kepler/reconcile-ods-window.js
                  --full --dedupe-fecha --delete-sobrantes --apply
                  --tables=$(node -e "const d=new Date();console.log([0,1,2,3].map(n=>{const x=new Date(d.getFullYear(),d.getMonth()-n,1);return 'kdc2'+String(x.getFullYear()).slice(2)+String(x.getMonth()+1).padStart(2,'0')}).join(','))");
                  r=$?;
                  node database/importers/kepler/arbitro-polizas-valor.js --apply;
                  a=$?;
                  exit $(( r ? r : a ))
              envFrom:
                - secretRef:
                    name: ingest-env
              env:
                - name: ODS_RECONCILE_HB_KEY
                  value: cdc_dedupe_fecha
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits:   { memory: "1Gi" }
