# ═══ EL PUENTE DE NOMBRES ═══  [K3S.1]
#
# ⭐ ESTO ES LO QUE HACE QUE LA MIGRACIÓN NO TOQUE NI UNA CREDENCIAL.
#
# Los carriles resuelven sus tres destinos por DNS de la red de Docker — medido el 2026-10-01
# dentro de `ods-live-hot`:
#
#     DATABASE_URL_NEW  ->  pg-prod:5432
#     ODS_HB_URL        ->  pg-prod:5432
#     ODS_SOURCE_BASE   ->  pg-ods:5432
#
# En K3s esos nombres no existen, así que el camino obvio sería reescribir el entorno a IPs.
# ⛔ Se rechaza: el entorno vive en `/home/superoot/secrets/ingest.env` y tocar credenciales
# está BLOCKED por decisión del usuario (`[A.0bis.1-3]`). Además, un entorno distinto entre
# Compose y K3s significa que durante la migración conviven DOS verdades sobre a dónde escribe
# cada carril — que es exactamente cómo se termina shipeando a la base equivocada (pasó en
# `[VL.14]`: el ship de Caja General escribía a la producción VIEJA y nadie lo notaba).
#
# En su lugar: un `Service` SIN selector más sus `Endpoints` a mano. K8s publica el nombre
# `pg-prod` dentro del clúster y lo apunta al host. El contenedor no se entera de nada: misma
# imagen, mismo secreto, misma URL. Y cuando algún día Postgres entre al clúster, se le pone
# selector a este mismo Service y los carriles siguen sin cambiar.
#
# ⚠️ Los dos Postgres NO se mudan, y no es pereza: `pg-prod` usa 11.96 GiB y `pgvector-md`
#    4.35 GiB contra 1.06 GiB de TODO lo demás junto. Meter 16 GiB de estado en el clúster para
#    orquestar 1 GiB de proceso es el argumento invertido. Entran al final, si entran.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingesta
---
# ── pg-prod: el DESTINO (prod, :5434 en el host) ──────────────────────────────
#
# ⛔⛔ [K3S.40] ESTE PUENTE TIENE EL MISMO DEFECTO QUE TENÍA `pg-ods`, Y TODAVÍA NO MORDIÓ
# SÓLO PORQUE `pg-prod` SIGUE EN DOCKER.
#
# El día que `pg-prod` pase a ser un pod con `hostPort`, este Service va a hacer DNAT hacia
# `192.168.0.222:5434` donde ya no habrá proceso escuchando —`hostPort` es sólo iptables— y
# dará ECONNREFUSED. Eso se midió en `pg-ods` el 2026-10-01: los carriles del ODS perdieron su
# fuente ~15 min.
#
# ⭐ CONVERTIRLO ES PARTE DEL CORTE, no un arreglo posterior. Los dos (éste y su gemelo del
# namespace `prod`, en 41-redis-worker-api.yaml) pasan a:
#     type: ExternalName
#     externalName: pg-prod-pod.prod.svc.cluster.local
# ⚠️ Si se migra la base sin esto, el API y los SIETE carriles pierden la base a la vez.
apiVersion: v1
kind: Service
metadata:
  name: pg-prod
  namespace: ingesta
spec:
  # Sin `selector` a propósito: los Endpoints se declaran a mano, abajo.
  ports:
    - name: postgres
      port: 5432          # el puerto que el entorno YA dice (pg-prod:5432)
      targetPort: 5434    # el puerto REAL en el host
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pg-prod           # el nombre DEBE coincidir con el Service de arriba
  namespace: ingesta
subsets:
  - addresses:
      - ip: 192.168.0.222
    ports:
      - name: postgres
        port: 5434
---
---
# ══ pg-ods: LA FUENTE DE LA INGESTA ══  [K3S.40]
#
# ⛔ ERA UN PUENTE A LA IP DEL HOST Y ESO DEJÓ DE FUNCIONAR AL MIGRAR LA BASE AL CLÚSTER.
#
# Decía: Service sin selector + Endpoints a mano → `192.168.0.222:5433`. Mientras Postgres
# corría en Docker eso andaba, porque `docker-proxy` es un PROCESO que escucha de verdad en
# ese puerto. Cuando `pgvector-md` pasó a ser un pod con `hostPort`, dejó de haber proceso:
# `hostPort` es sólo una regla de iptables.
#
# Resultado medido el 2026-10-01: kube-proxy hacía DNAT del ClusterIP a `192.168.0.222:5433`,
# ese paquete ya NO volvía a pasar por la cadena del portmap, y no había nadie escuchando →
# ECONNREFUSED. ⭐ El detalle que lo delató: un pod alcanzaba `192.168.0.222:5433` DIRECTO y
# fallaba por el Service. Doble DNAT en una pasada no ocurre. Los carriles del ODS estuvieron
# ~15 min sin fuente.
#
# Ahora que la base vive adentro, el puente sobra: `ExternalName` manda el nombre al Service
# real del pod y el tráfico nunca sale del clúster. Los carriles siguen diciendo `pg-ods:5432`.
apiVersion: v1
kind: Service
metadata:
  name: pg-ods
  namespace: ingesta
spec:
  type: ExternalName
  externalName: pgvector-md.prod.svc.cluster.local
