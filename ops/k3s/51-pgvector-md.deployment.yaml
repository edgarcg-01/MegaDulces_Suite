# ═══ pgvector-md — LA FUENTE DE LA INGESTA ═══  [K3S.38]
#
# 65.8 GB, 13 bases y NUEVE suscripciones de replicación lógica vivas contra las sucursales.
# Es de donde los siete carriles del ODS leen todo. Si esto se cae, la venta y la existencia
# publicadas dejan de refrescarse — pero se recuperan solas por watermark, que es exactamente
# por qué va ANTES que `pg-prod`: su peor caso es recuperable.
#
# ── EL DATO NO SE COPIA NI SE MUEVE: se monta donde ya está ─────────────────
#
# 65.8 GB copiados exigirían parar la base mientras se copia — minutos de ingesta detenida.
# El pod monta por hostPath el MISMO directorio que usaba el contenedor, así que el corte dura
# lo que tarda un pod en arrancar.
#
# ⛔ Eso acopla K3s al layout de volúmenes de Docker, y hay que decirlo en voz alta: un
# `docker volume prune` borraría datos que un pod está usando.
# ⭐ La defensa es deliberada: el contenedor `pgvector-md` se deja DETENIDO, no se borra. Un
# volumen referenciado por un contenedor —aunque esté apagado— NO lo toca `prune`. Y de paso
# ese contenedor es la vuelta atrás: `docker start pgvector-md`.
# ⚠️ Corolario: el día que alguien borre ese contenedor "porque está apagado", desprotege 65 GB.
#
# ── ⛔ SIN `PGDATA`, Y ESTO SE APRENDIÓ ROMPIÉNDOLO ─────────────────────────
#
# En `pg-rag` se puso `PGDATA: /var/lib/postgresql/data` "para ser explícito" y la explicitud
# fue el error: PostgreSQL 18 cambió el layout de la imagen oficial a
# `/var/lib/postgresql/18/docker`. Forzar la ruta vieja hizo que Postgres no encontrara cluster
# y CREARA UNO NUEVO Y VACÍO — el pod arrancó, la sonda `select 1` dio verde, y las bases no
# estaban. Medido en el contenedor vivo antes de escribir esto: `show data_directory` dice
# `/var/lib/postgresql/18/docker`. La imagen sabe dónde está su dato; no hay que ayudarla.
#
# ── Las tres trampas de Postgres en K8s ────────────────────────────────────
#
# ⛔ SIN `limits.memory`: el cgroup cuenta el page cache, que es la caché real de Postgres. Un
#    límite lo mata por OOM justo cuando está trabajando bien.
# ⛔ `/dev/shm` de 1 GB: el default de 64 MB rompe los parallel workers con "could not resize
#    shared memory segment". ⚠️ El emptyDir en memoria cuenta contra `requests.memory`.
# ⛔ `replicas: 1` + `Recreate`: dos Postgres sobre el mismo datadir no son dos réplicas, son
#    corrupción.
---
apiVersion: v1
kind: Service
metadata: { name: pgvector-md, namespace: prod }
spec:
  selector: { app: pgvector-md }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector-md
  namespace: prod
  labels: { app: pgvector-md, singleton: "true", migracion: migrado }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: pgvector-md }
  template:
    metadata:
      labels: { app: pgvector-md }
    spec:
      # ⚠️ 65 GB no se apagan de golpe. Postgres necesita su checkpoint de cierre; si lo matan
      # antes, el arranque siguiente entra en recuperación y tarda. El default de K8s son 30 s.
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          ports:
            # hostPort 5433, el MISMO que publicaba Compose: los puentes `pg-ods` de los
            # carriles apuntan a 192.168.0.222:5433 y no se enteran del cambio.
            - { name: postgres, containerPort: 5432, hostPort: 5433, protocol: TCP }
          env:
            - { name: TZ, value: America/Mexico_City }
            # ⛔ [K3S.38] SIN POSTGRES_PASSWORD, y se comprobo antes de cortar: el contenedor
            # vivo NO la tiene en su entorno. La imagen oficial solo la usa al INICIALIZAR un
            # datadir vacio; con el dato ya existente, pedirla sobra. Un secretKeyRef a una
            # clave que no existe habria dejado el pod en CreateContainerConfigError.
            # ⭐ Se vio porque el volcado del entorno del contenedor devolvio CERO lineas, no
            # porque lo supusiera: copiar la forma de un manifiesto anterior sin medir el
            # servicio que se migra es como se arrastran supuestos ajenos.
          volumeMounts:
            - { name: datos, mountPath: /var/lib/postgresql }
            - { name: shm,   mountPath: /dev/shm }
          # ⭐ La sonda cuenta BASES, no pregunta si el motor vive. Un Postgres recién
          # inicializado y vacío contesta `select 1` igual de bien que el que tiene los datos
          # — así pasó desapercibido el cluster vacío de `pg-rag`. Trece es lo que había.
          readinessProbe:
            exec:
              command: ["sh", "-c", "test \"$(psql -U postgres -t -A -c 'select count(*) from pg_database where datistemplate=false')\" -ge 13"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
          resources:
            # ⛔ SIN limits. Ver arriba.
            requests: { memory: "2Gi", cpu: "200m" }
      volumes:
        - name: datos
          hostPath: { path: /var/lib/docker/volumes/pgvector-md-data/_data, type: Directory }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
