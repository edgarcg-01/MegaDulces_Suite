# ─────────────────────────────────────────────────────────────────────────────
# Fase VL (ADR-060) — el stack de ingesta EN EL SERVIDOR `md` (192.168.0.222).
#
# ⭐ [CT.2 2026-09-24] ESTE ES EL ÚNICO COMPOSE DE LA INGESTA. Reemplazó al de `.249`
# (`ops/ingest/docker-compose.yml`), que se BORRÓ en CT.2 y ya no existe. Se borró porque
# declaraba los MISMOS `container_name` con el MISMO `ODS_HB_KEY` — o sea el mismo `ods.ctl`,
# el mismo `ods.shadow` y el mismo renglón de `analytics.cron_runs` que éstos — y encima había
# DIVERGIDO (`ODS_RECONCILE_ALERT: 50` contra 1000 acá; excluía `kdpv_bitacora_precios`, acá no).
# Dos repartos vivos del mismo carril en el mismo repo es el riesgo de `[ODS.1]` sin desactivar.
#
# Lo que aquel traía y ESTE conserva, para que no se pierda el porqué:
#   · el `env_file` vive en ~/secrets/ (Linux, 600), no en C:\KeplerRunner\
#   · la fuente se alcanza por IP LAN, no por host.docker.internal
#   · acá SÍ vive el Postgres de las réplicas (en `.249` estaba en otro compose)
#
# ⛔ `ops/ingest/` NO se borró: ahí siguen el `Dockerfile` que construye `trade-ingest:latest`
#    (ops/vl/deploy.sh lo usa) y los healthchecks `health.js` / `health-lane.sh`.
#
#   docker compose -f ops/vl/docker-compose.yml up -d              # sólo los carriles (VL.2a)
#   docker compose -f ops/vl/docker-compose.yml --profile db up -d # + Postgres (VL.2b)
#
# ⚠️ ORDEN DE LOS SPRINTS. En VL.2a los carriles leen la fuente que TODAVÍA vive en
# `.249:5433` (así lo dice ~/secrets/ingest.env). El servicio `pg-ods` está detrás
# del perfil `db` a propósito: si se levanta antes de VL.2b, `initdb` crea un
# cluster VACÍO en el volumen y después no hay dónde poner la copia física.
# En VL.2b: parar todo → copiar el volumen → `--profile db up -d` → reapuntar
# ODS_SOURCE_BASE a `pg-ods:5432` → VL.2c (desactivar suscripciones en `.249`).
#
# ⛔ NUNCA dos shippers a la vez: `ods.ctl`/`ods.shadow` son estado compartido.
#    Apagar los de `.249` ANTES de levantar éstos.
#
# ⛔⛔ NO EXISTE "una pasada de prueba" DE ESTE SCRIPT CON --watch.
#     `replicate-ods-live.js` declara en su encabezado "--watch … implica apply", y el
#     rótulo del modo lo confirma: `APPLY || WATCH_SEC ? 'APPLY' : 'DRY-RUN'`. Peor:
#     `--watch=0` NO es "una sola pasada" — `Math.max(3, Number(0))` lo convierte en
#     **3 segundos**, o sea el loop más agresivo posible.
#     Vivido el 2026-09-10 probando este compose: un `docker compose run` con
#     `--watch=0`, creído en seco, corrió 9 ciclos shipeando en paralelo con el carril
#     de `.249` durante ~8 min. No dejó hueco (el reconciliador midió 48 vs 49 de
#     baseline) porque las escrituras son UPSERT idempotente y el script repasa 3 días,
#     pero fue suerte de diseño, no del comando.
#     ✅ Prueba en seco DE VERDAD: sin `--apply` **y sin `--watch`**. Una pasada, no escribe.
# ─────────────────────────────────────────────────────────────────────────────

# ⭐ [ODS.1] La lista de SUCURSALES ya no se declara acá. Vivía copiada en estos tres
# servicios y en cuatro scripts; una de esas copias se quedó en SIETE ramas y el
# reconciliador nocturno dejó de mirar Morelia Madero (07) y Morelia Abastos (08) sin
# ninguna señal — en la 08, `kdpord` publicaba 4,603 filas contra 1,669 reales.
# Ahora todos los scripts derivan de `database/importers/lib/kepler-branches.js`, que es
# el catálogo canónico. Una sucursal nueva se agrega AHÍ y llega sola a todos lados.
# `ODS_LIVE_BRANCHES` sigue funcionando como escape para correr un subconjunto a mano.
x-lane: &lane
  image: trade-ingest:latest
  restart: unless-stopped
  env_file: [/home/superoot/secrets/ingest.env]
  labels: { autoheal: "true" }
  logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }
  # [VL.11] Los carriles ahora ESCRIBEN a `pg-prod`, que vive en la red del stack de
  # produccion. Sin esto no resuelven el nombre. `default` sigue siendo `vl_default`, que es
  # donde esta `pg-ods` (la fuente).
  networks: [default, prod]

services:
  # ═══ LA FUENTE ═══ (perfil `db`: NO arranca hasta VL.2b — ver la nota de arriba)
  pg-ods:
    profiles: ["db"]
    image: pgvector/pgvector:pg18
    container_name: pgvector-md
    restart: unless-stopped
    volumes: ["pgvector-md-data:/var/lib/postgresql"]
    ports: ["5433:5432"]

    # ⚠️ /dev/shm de Docker son 64 MB por default, y Postgres saca de ahí la memoria
    # de los parallel workers (`dynamic_shared_memory_type=posix`). Con 64 MB un
    # VACUUM o REINDEX paralelo sobre una tabla grande tira "could not resize shared
    # memory segment". Nativo no tiene el problema (su /dev/shm es media RAM).
    shm_size: 1gb
    # [VL.6] ⛔ EL APAGADO TIENE QUE CABER EN LA VENTANA. Sin `stop_grace_period` Docker da
    # 10 s y después manda SIGKILL: un Postgres al que se le corta el checkpoint de cierre
    # arranca haciendo RECUPERACIÓN DE CAÍDA, y eso convierte un reinicio de 2 min en uno de
    # veinte — justo cuando se está esperando que la ingesta vuelva sola.
    # `StopSignal` de esta imagen es SIGINT = apagado RÁPIDO (correcto: termina conexiones y
    # hace un checkpoint inmediato). En NVMe eso son fracciones de segundo para los ~60 MB de
    # buffers sucios que se midieron acá, así que 60 s es holgura, no espera.
    stop_grace_period: 60s

    # ⛔ SIN `mem_limit` a propósito. Con límite, el cgroup cuenta el PAGE CACHE
    # contra el tope y el kernel lo recupera bajo presión: la base termina releyendo
    # del disco lo que creía cacheado. Es la única forma real en que Docker perjudica
    # a un Postgres, y se evita no poniéndolo.

    # ── Memoria. Medido: el cluster de `.249` estaba TODO en default de fábrica, con
    #    shared_buffers en 128 MB. Presupuesto sobre los 14 GiB de `md`: 4 de buffers
    #    + ~7 de page cache ≈ 11 GB de caché para 11.1 GB de datos.
    # ── Replicación lógica. ⚠️ Los cinco últimos DEBEN ser >= a los del cluster de
    #    origen o el datadir copiado NO ARRANCA. Medidos en `.249` el 2026-09-10:
    #    wal_level=logical · slots=20 · wal_senders=20 · logical_workers=16 · workers=24
    command:
      - postgres
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=9GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=20"
      - "-c"
      - "max_wal_senders=20"
      - "-c"
      - "max_logical_replication_workers=16"
      - "-c"
      - "max_worker_processes=24"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  # ═══ CARRIL CALIENTE ═══ venta, movimientos y catálogos. @15 s.
  ods-live-hot:
    # [K3S.10] MIGRADO A K3s 2026-10-01 -- no arranca solo. Ver ops/k3s/README.md
    profiles: ["retirado-k3s"]
    <<: *lane
    container_name: ods-live-hot
    environment:
      ODS_HB_KEY: ods_live_hot
      ODS_HB_MAX_MIN: "20"
      # ⭐ [CT.3 2026-09-24] LAS DOS LISTAS NO SON INTERCAMBIABLES, y por confundirlas había
      # cuatro entradas que no hacían nada. Medido en el código, no en la doc:
      # `replicate-ods-live.js:105` arma el conjunto a procesar SÓLO desde KP_ODS_TABLES, y
      # `isHashTable()` (L111) nada más elige el CARRIL. O sea: ODS_HASH_TABLES **no puede
      # agregar** una tabla; es un filtro sobre las que ya están en la maestra.
      #
      # Lo que se retiró, con su medición del 2026-09-24 contra prod:
      #
      #   · `kdib` estaba en la MAESTRA — o sea en el carril ctid, cada 15 s — y su destino
      #     NO EXISTE: `to_regclass('kepler_ods.kdib')` da NULL en prod. En la fuente sí existe
      #     (`md.kdib` está en las réplicas), así que no es una tabla mal escrita: es una que
      #     nunca pudo entregar. Y el carril no protesta — 0 menciones en sus 441 líneas de log,
      #     contra 55 de `kdii` y 48 de `kdm1`. No falla: CALLA.
      #     ⚠️ Se midió con `--tail`, no con `--since`: tras un reinicio sucio `docker logs
      #     --since` recorre el segmento VIEJO del json y devuelve 0 con el carril escribiendo.
      #
      #   · `kdm_rutas`, `kdm_transporte` y `kdm_chofer` estaban en ODS_HASH_TABLES pero NO en
      #     la maestra → inertes por la regla de arriba. Tienen datos reales (743 / 264 / 281
      #     filas) y las entrega el ESPEJO (`ods-live-mirror`, KP_ODS_TABLES="*"), verificado:
      #     llegan a las 9 sucursales. Sacarlas de acá no cambia una sola fila.
      #
      # ⭐ [INFRA.3 + INFRA.4 2026-09-30] EL HALLAZGO GRANDE, DESACTIVADO. Acá decía que esta
      # lista vivía COPIADA A MANO en cuatro lugares y que tocarlas sin una prueba era como se
      # pierde una sucursal en silencio — la misma bomba de `[ODS.1]`. Medido al desactivarlo,
      # las copias YA DIVERGÍAN: el default de `replicate-ods-live.js` traía `kdib` (retirada el
      # 2026-09-24 porque su destino no existe) y le FALTABAN seis familias que sí se embarcan
      # (`kdco`, `kdc3`, `kdpv_folio_caja`, `kdxd`, `kdxe`, `kdc2*`). Nadie lo notaba porque los
      # contenedores fijan la variable: ese default sólo salía a escena corriendo el script A
      # MANO —depuración, puesta al día, recuperación—, que es justo cuando menos se mira lo
      # que se embarcó.
      #
      #   · [INFRA.3] el default se RETIRÓ: sin `KP_ODS_TABLES` el script sale con código 1 en
      #     vez de shipear un conjunto plausible. Un default equivocado es peor que ninguno.
      #   · [INFRA.4] las dos que QUEDAN —ésta y el `ODS_EXCLUDE_TABLES` del espejo, las que de
      #     verdad embarcan— las candadea `database/tests/test-ods-lane-partition.js`: sin
      #     traslape (si una tabla cae en los dos carriles se pisan `ods.ctl`, que llavea sólo
      #     `(table_name)`, y las filas del medio no se vuelven a mirar), huecos DECLARADOS con
      #     su motivo, y `ODS_HASH_TABLES ⊆ KP_ODS_TABLES` para que no vuelva el bug de `[CT.3]`.
      #     Importa el matcher de globs de producción en vez de reimplementar `kdc2*`.
      #
      # ⚠️ Quedan DOS copias más, pero son de DOCUMENTACIÓN y describen un launcher que ya no
      # existe (`run-ods-live-loop.cmd`, muerto desde que `[VL.4]` movió los 13 carriles acá):
      # `RUNBOOK_REPLICACION_LOGICA.md` y `FASE_CV`. Las dos traen `kdib`. No embarcan nada —
      # el riesgo es que alguien las siga durante una recuperación.
      KP_ODS_TABLES: kdm1,kdm2,kdij,kdue,kdii,kdil,kdik,kdig,kdid,kduv,kdud,kdb1,kdco,kdc3,kdpv_folio_caja,kdxd,kdxe,kdc2*
      ODS_HASH_TABLES: kdii,kdil,kdik,kdig,kdid,kduv,kdud,kdb1,kdco,kdc3,kdpv_folio_caja,kdxd,kdxe,kdc2*
    command: ["node", "database/importers/kepler/replicate-ods-live.js", "--apply", "--watch=15"]

  # ═══ ESPEJO COMPLETO ═══ todo md.* MENOS el set del hot. @300 s.
  ods-live-mirror:
    # [K3S.9] MIGRADO A K3s 2026-10-01 -- no arranca solo. Ver ops/k3s/README.md
    profiles: ["retirado-k3s"]
    <<: *lane
    container_name: ods-live-mirror
    depends_on: [ods-live-hot]
    environment:
      ODS_HB_KEY: ods_live_mirror
      ODS_HB_MAX_MIN: "45"
      KP_ODS_TABLES: "*"
      # `[ETQ-CAMBIOS.2]` `kdpv_bitacora_precios` SALE de la exclusión: es la única fuente del
      # sistema que guarda el precio ANTERIOR, y sin ella la pantalla de cambios de precio no
      # puede tener ni selector de fechas ni "antes vs después" (`updated_at` guarda el último
      # toque, no un registro).
      #
      # ⛔ NO se enciende sola: antes hay que SEMBRAR el watermark. Medido el 2026-09-21 — la
      # tabla no tiene fila en `ods.ctl`, y `syncCtid` drena con un `for(;;)` SIN tope por ciclo
      # y graba el watermark RECIÉN al terminar. O sea que la primera pasada intentaría shipear
      # las **8.2M filas** del origen de una sola vez (1.09M solo en md_08) y, si muere a la
      # mitad, vuelve a empezar de cero. Procedimiento en `docs/IMPLEMENTACION/FASES/FASE_ETQ.md`.
      #
      # Régimen estable, medido: ~55,000 filas/día entre las 9 ramas. De ésas, ~100 cambian el
      # precio IMPRESO — el 99.8% es ruido de recálculo sub-centavo. El ruido se filtra en la
      # VISTA y no acá: el ODS es un espejo, y un espejo que filtra miente.
      ODS_EXCLUDE_TABLES: kdm1,kdm2,kdij,kdue,kdii,kdil,kdik,kdig,kdib,kdid,kduv,kdud,kdb1,kdco,kdc3,kdpv_folio_caja,kdxd,kdxe,kdc2*
    command: ["node", "database/importers/kepler/replicate-ods-live.js", "--apply", "--watch=300"]

  # ═══ RECONCILIADOR ═══ la ÚNICA alarma de COMPLETITUD. Late directo a prod.
  # Su `status='error'` significa "el pipeline pierde filas" (alarma de DATO), no
  # "el contenedor está roto": reiniciarlo no repone ni una fila. Por eso
  # ODS_HB_IGNORE_ERROR=1 y el healthcheck juzga sólo la antigüedad del latido.
  ods-reconcile:
    # [K3S.8] MIGRADO A K3s 2026-10-01 -- no arranca solo. Ver ops/k3s/README.md
    profiles: ["retirado-k3s"]
    <<: *lane
    container_name: ods-reconcile
    depends_on: [ods-live-hot]
    environment:
      ODS_HB_KEY: cdc_reconcile
      ODS_HB_MAX_MIN: "45"
      # ⭐ 50 → 1000 el 2026-09-22, con la medición. Sobre 1,217 corridas de 14 días la
      # distribución de `huecos` es p50=5 · p90=115 · p95=182 · p99=503 · max=14,479: el 50
      # estaba DENTRO del ruido y ponía en rojo 280 corridas (23 %) que habían repuesto TODO.
      # Y el valor vive acá, no sólo en el default del script: cambiar el código sin cambiar
      # esta línea habría sido un arreglo que no llega a producción.
      ODS_RECONCILE_ALERT: "1000"
      ODS_HB_IGNORE_ERROR: "1"
      # OBS.11 propagacion de DELETE: "0" = solo reporta sobrantes (default seguro). "1" = los BORRA
      # del ODS por raw-delete, con re-chequeo full-table (0% falso positivo) y freno ODS_DELETE_MAX_FRAC
      # (0.6). kdpord (~61% fantasma, cola de surtido) se ABORTA solo; kdm2/kdij (chicas) se propagan.
      # El backlog de kdpord es decision aparte (barrido --full vigilado con umbral elevado), no aqui.
      ODS_DELETE_SOBRANTES: "0"
    command: ["node", "database/importers/kepler/reconcile-ods-window.js", "--days=3", "--apply", "--watch=900"]
    healthcheck:
      test: ["CMD", "node", "/app/ops/ingest/health.js"]
      interval: 120s
      timeout: 30s
      start_period: 20m
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # OBS.11 — BARRIDO DIARIO del backlog de kdpord (cola de surtido de alta rotacion).
  # NO va en el carril continuo (ods-reconcile): su ventana de 3d es ~61% fantasma y el freno lo
  # abortaria cada 15 min (tablero rojo). Off-hours, --full, con el MISMO env que ods-reconcile
  # (ingest.env via *lane): ODS_SOURCE_BASE=replicas + DATABASE_URL_NEW=prod + FEEDS_SINK=http.
  # Corre --full UNA vez al arrancar (limpieza + latido inmediato para el healthcheck) y despues
  # cada dia 03:00 MX via crond. Latido PROPIO (cdc_reconcile_full) para no pisar el del carril.
  # ═══════════════════════════════════════════════════════════════════════════
  # ⭐ [ODS.2] La red de seguridad de las tablas CHICAS — las que no tienen fecha de negocio.
  #
  # Antes sólo se reconciliaban 5 tablas (kdm1, kdm2, kdij, kdue, kdpord), porque la ventana se
  # acota por fecha y el resto no la tiene. Todo lo demás del ODS estaba sin red: medido contra la
  # réplica el 2026-09-23, 17 tablas perdían filas y 8 publicaban filas ya borradas en el origen.
  #
  # `--chicas` compara el universo COMPLETO de llaves, no una ventana, y shipea sólo las ausentes.
  # Es viable porque el freno de tamaño del propio script (100 MB, medido con
  # `pg_total_relation_size`) rechaza cualquier tabla que no sea chica — el modo es válido PORQUE
  # lo son, así que la validación no puede depender de esta lista.
  #
  # ⚠️ Cadencia 30 min y no 15: son 16 tablas × 9 ramas y ninguna es de movimiento vivo. Las que
  # cambian a cada segundo (kdm1/kdm2) las cubre `ods-reconcile`, que sigue con su ventana de 3 d.
  #
  # ⛔ DELETE APAGADO a propósito. Al cerrar los faltantes quedaron 259 sobrantes en la rama 08
  # (kdpv_prod_util 222, kdii 26, …). Propagar ese DELETE es una decisión con evidencia aparte, no
  # un efecto colateral de encender un carril.
  ods-reconcile-chicas:
    # ⛔ [K3S.6 2026-10-01] MIGRADO A K3s — primer carril que se fue. El perfil lo deja declarado
    # pero NO lo arranca: `docker compose up -d` sin nombrarlo lo ignora. Si corriera a la vez que
    # el Deployment `ingesta/ods-reconcile-chicas`, los dos escribirían el renglón
    # `cdc_reconcile_chicas` de `analytics.cron_runs` y se lo pisarían. Un carril = un dueño.
    # Verificado al migrar: el latido pasó de `host=9da95f2080de` (este contenedor) a
    # `host=ods-reconcile-chicas-f6d56b558-k674k` (el pod), status ok, primera pasada en 10 s.
    # Volver atrás: `docker compose --profile retirado-k3s up -d ods-reconcile-chicas` y borrar
    # el Deployment. No se pierde una fila: el carril es idempotente y su tope de latido es 90 min.
    profiles: ["retirado-k3s"]
    <<: *lane
    container_name: ods-reconcile-chicas
    depends_on: [ods-live-hot]
    environment:
      # ⛔ LA VARIABLE ES `ODS_RECONCILE_HB_KEY`, NO `ODS_HB_KEY`. Medido el 2026-09-24: este
      # carril nació (2026-09-23) con `ODS_HB_KEY` —el nombre que usan los OTROS servicios de
      # este archivo— y `reconcile-ods-window.js` lee `ODS_RECONCILE_HB_KEY`. Resultado: cayó al
      # default `'cdc_reconcile'` y estuvo **pisando el latido del reconciliador con ventana**,
      # que es "la única alarma de COMPLETITUD" del sistema según el propio script. Dos carriles
      # escribiendo la MISMA fila: el tablero mostraba al que hubiera corrido último.
      #
      # ⚠️ No fue mudo, fue PEOR que mudo. Un carril mudo deja un renglón envejeciendo que
      # alguien puede ver; éste mantenía el renglón ajeno fresco y verde con SUS números.
      # Se descubrió porque `cdc_reconcile_chicas` no existía en `cron_runs` — la llave estaba
      # registrada en `CRON_JOBS` y eso la delató.
      ODS_RECONCILE_HB_KEY: cdc_reconcile_chicas
      # [K3S.7] health.js lee ODS_HB_KEY, no ODS_RECONCILE_HB_KEY: sin ella el chequeo
      # imprime "no se evalua" y SALE 0 -- healthy pase lo que pase. Venia asi.
      ODS_HB_KEY: cdc_reconcile_chicas
      ODS_HB_MAX_MIN: "90"
      ODS_HB_IGNORE_ERROR: "1"
      ODS_DELETE_SOBRANTES: "0"
    command: ["node", "database/importers/kepler/reconcile-ods-window.js", "--chicas", "--apply", "--watch=1800",
              "--tables=kdfe4imp,kdfedir,kdfe33docprv,kdxe,kdpv_folio_caja,kdpv_prod_util,kdm_m2,kdud,kdudent,kdug,kdm_rutas2,kdxg,kdfe33relprd,kdii,kdm_rutas,kdpv_prov_prod"]
    healthcheck:
      test: ["CMD", "node", "/app/ops/ingest/health.js"]
      interval: 120s
      timeout: 30s
      start_period: 20m
      retries: 3

  ods-reconcile-full:
    <<: *lane
    container_name: ods-reconcile-full
    depends_on: [ods-live-hot]
    environment:
      TZ: America/Mexico_City
      ODS_RECONCILE_HB_KEY: cdc_reconcile_full
      ODS_HB_KEY: cdc_reconcile_full
      ODS_HB_MAX_MIN: "1560"
      ODS_HB_IGNORE_ERROR: "1"
    # [CT.4] La agenda salio a ops/vl/crontab.reconcile-full y la pasada de arranque SE FUE.
    # Antes esta linea traia las dos cosas metidas en una cadena de shell: el horario (0 3,
    # que chocaba con `nightly`) escrito con `| crontab -` en runtime, y una pasada
    # `--full --delete-sobrantes` que se disparaba en CADA arranque del contenedor.
    # Esa pasada fallo sola el 2026-09-24 a las 15:05 tras el corte de corriente
    # (`ERR the database system is starting up`: arranco 2 s antes que Postgres) y NO dejo
    # latido de error, porque este carril lleva ODS_HB_IGNORE_ERROR=1. Fallo en silencio.
    # Misma forma que `feeds-cron`: la agenda es un archivo del repo, horneado en la imagen.
    entrypoint: ["/bin/sh", "-c"]
    command: ["crontab /app/ops/vl/crontab.reconcile-full && exec crond -f -d 8"]
    # ⛔ [OBS.4.3] ESTE CONTENEDOR ES UN PLANIFICADOR, NO UN CARRIL — y confundirlo se comió el
    # trabajo todas las noches.
    #
    # Tenía el healthcheck de ENTREGA (`ops/ingest/health.js`), que exige que el latido del carril
    # sea reciente. Los demás carriles corren con `--watch` y laten seguido, así que les calza. Éste
    # corre UNA VEZ AL DÍA y, peor, escribe su latido **sólo al TERMINAR** (`latir()` en
    # reconcile-ods-window.js; no usa `hb.begin()`, o sea que nunca existe un estado `running`).
    #
    # Resultado medido en `md` el 2026-09-30:
    #   1. el despliegue de hace 28 h creó un contenedor nuevo, con hostname nuevo;
    #   2. la fila de `cron_runs` seguía con el hostname del PREDECESOR (la escribió él, el 29-sep);
    #   3. la guarda de dueño de health.js dice "lo late otro, no yo" y sale 1 — sin mirar la edad,
    #      o sea que un CADÁVER bloquea el carril igual que un competidor vivo;
    #   4. `ods-autoheal` lo reinicia: **109 reinicios en 30 h, uno cada 15 min clavados**;
    #   5. el trabajo dispara a las 02:10 MX, corre ~10 min y el reinicio lo MATA antes de
    #      `latir()` → la fila nunca se actualiza → el hostname sigue siendo ajeno → volver a (3).
    #
    # El tablero lo reportaba como «SIN CORRER hace 36 h; la última terminó bien». Las dos mitades
    # eran ciertas: arrancaba cada noche y lo mataban.
    #
    # Ahora el chequeo verifica lo que este contenedor SÍ es responsable de: que su planificador
    # esté vivo. La ENTREGA la juzga `db-health` con el umbral de `cdc_reconcile_full` en
    # `CRON_JOBS` (warnH 25 / critH 30) — que es el canal que destapó esto, y que por ADR-053 tiene
    # que ser distinto del que se vigila. Matar al planificador porque su carga diaria todavía no
    # aterrizó es pedirle a un reloj que demuestre la hora antes de darle cuerda.
    healthcheck:
      test: ["CMD-SHELL", "pidof crond >/dev/null"]
      interval: 300s
      timeout: 30s
      start_period: 300s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # VL.4 — LOS CARRILES QUE SALIERON DEL PROGRAMADOR DE WINDOWS
  #
  # ⚠️ Env DISTINTO al de los carriles del ODS, a propósito: `feeds.env`, no
  # `ingest.env`. En los feeds `DATABASE_URL_NEW` es **prod** (el destino); en los
  # del ODS es la **fuente**. Mezclarlos es el modo de falla exacto que dejó el ODS
  # congelado 6 días (GOTCHAS §17).
  # ⚠️ `TZ` explícita: los nocturnos del crontab están en hora MX, como en el
  # Programador. Sin esto correrían 6 h corridos.
  # ═══════════════════════════════════════════════════════════════════════════

  # 11 carriles agendados en UN contenedor, con la agenda versionada en
  # ops/vl/crontab.feeds. `crond -f -d 8` = primer plano y log a stdout, para que
  # `docker compose logs feeds-cron` muestre lo que hizo cada carril.
  feeds-cron:
    image: trade-ingest:latest
    container_name: feeds-cron
    restart: unless-stopped
    volumes:
      - /home/superoot/secrets/feeds.env:/secrets/feeds.env:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["crontab /app/ops/vl/crontab.feeds && exec crond -f -d 8"]
    # [VL.6.1] CANARIO, no auditoría. Este contenedor no tiene UN carril sino once, así que
    # `ODS_HB_KEY` lleva tres de los que corren cada minuto y basta con que UNO entregue: lo
    # que hay que probar es que el camino cron → run-feed.sh → node → prod funciona. Si un
    # carril concreto está mal, eso lo grita db-health (que sí tiene el umbral de cada uno);
    # reiniciar los once porque la fuente de uno se cayó no repone una sola fila.
    # Tres claves y no una: atarlo a un solo carril lo deja en bucle de reinicio eterno el día
    # que ese carril se retire o se renombre.
    # ⚠️ IGNORE_ERROR=1 porque `status='error'` de estos carriles es alarma de DATO
    # (ContPAQi caído, sesión del GPS vencida) y reiniciar no lo arregla.
    #
    # [LT.9.2] Se cambiaron las tres claves, y el día que se retiró un carril es justo el día
    # que el comentario de arriba anticipaba. Las dos que salieron estaban rotas de distinta forma:
    #   · `fleet_gps` ya NO la escribe este contenedor (el carril se retiró; ahora late el poller
    #     del API en Railway). Dejarla sería peor que quitarla: el canario diría "sano" mirando
    #     una llave que escribe OTRA máquina — exactamente el falso verde que este archivo combate.
    #   · `feed_receipts` era canario muerto desde DB-MEM.2: ese carril pasó de cada minuto a
    #     `30 4 * * *`, así que contra `MAX_MIN=10` está vencido 23 de cada 24 horas.
    # Las tres de ahora las escribe ESTE contenedor y entregan dentro de la ventana de 10 min:
    # `feed_contpaqi` (@1 min), `contpaqi_add_cfdis` (@5 min), `health_watchdog` (@5 min).
    environment:
      TZ: America/Mexico_City
      ODS_HB_KEY: "feed_contpaqi,contpaqi_add_cfdis,health_watchdog"
      ODS_HB_MAX_MIN: "10"
      ODS_HB_IGNORE_ERROR: "1"
    healthcheck:
      test: ["CMD", "/app/ops/ingest/health-lane.sh"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    labels: { autoheal: "true" }
    logging: { driver: json-file, options: { max-size: "50m", max-file: "3" } }
    networks: [default, prod]   # [VL.11] para alcanzar pg-prod

  # Sub-minuto: el cron no llega. Loop propio, como el `run-livefast-loop.cmd` que
  # reemplaza (sales-fact → sales_daily + cash-sessions, ventana de 2 días).
  feeds-livefast:
    # [K3S.11/12] MIGRADO A K3s 2026-10-01 -- no arranca solo. Ver ops/k3s/README.md
    profiles: ["retirado-k3s"]
    image: trade-ingest:latest
    container_name: feeds-livefast
    restart: unless-stopped
    env_file: [/home/superoot/secrets/feeds.env]
    # [VL.6.1] Un solo carril, así que el healthcheck pregunta por ÉL. Corre cada 60 s y su
    # pasada dura ~40 s; 10 min de tope distingue holgadamente "lento" de "colgado".
    environment:
      TZ: America/Mexico_City
      SALES_FACT_DAYS: "2"
      ODS_HB_KEY: feed_livefast
      ODS_HB_MAX_MIN: "10"
      ODS_HB_IGNORE_ERROR: "1"
    command:
      - /bin/sh
      - -c
      - 'while :; do node database/importers/kepler/run-prod-feeds.js livefast --apply; echo "[$(date "+%F %T %Z")] pasada livefast lista, siguiente en 60s"; sleep 60; done'
    healthcheck:
      test: ["CMD", "/app/ops/ingest/health-lane.sh"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    labels: { autoheal: "true" }
    logging: { driver: json-file, options: { max-size: "50m", max-file: "3" } }
    networks: [default, prod]   # [VL.11] para alcanzar pg-prod

  # Sub-minuto: tickets en vivo de las 6 sucursales → WS /store de prod. Reemplaza
  # `C:\KeplerPush\store-poller.cmd`, que además era uno de los 2 únicos que corrían
  # como SYSTEM (los otros 17 dependían de una sesión de usuario abierta).
  store-poller:
    # [K3S.11/12] MIGRADO A K3s 2026-10-01 -- no arranca solo. Ver ops/k3s/README.md
    profiles: ["retirado-k3s"]
    image: trade-ingest:latest
    container_name: store-poller
    restart: unless-stopped
    env_file: [/home/superoot/secrets/feeds.env]
    # [VL.6.1] ⭐ ESTE es el que probó por qué hacía falta. El 2026-09-11, 20 min después de
    # mudarlo, quedó colgado en un `client.end()` contra Yurécuaro (socket en FIN_WAIT1): el
    # proceso vivo, el log mudo, y `docker inspect` diciendo `healthy` — porque el healthcheck
    # heredado salía por la rama "no se evalúa". Lo encontró un humano leyendo el latido.
    # Ahora el latido ES el healthcheck, y `autoheal` es el brazo que lo ejecuta.
    # IGNORE_ERROR=1: este carril se pone en `error` cuando una rama falla (un timeout de
    # Railway, un POS que no contesta) y reiniciar no arregla ninguna de las dos; lo que sí
    # tiene que disparar el reinicio es que el ciclo DEJE DE COMPLETARSE, que es el cuelgue.
    environment:
      TZ: America/Mexico_City
      # ⭐⭐ [VL.11.B2] DIRECTO AL CONTENEDOR DE AL LADO. Este poller corre EN `md` y la API
      # también, así que mandar el ticket por un nombre público era dar una vuelta absurda:
      # salía al gateway, volvía a entrar, y pagaba un apretón TLS — para hablar con un proceso
      # que está en la misma máquina. Lo señaló el usuario y tiene razón.
      #
      # Ahora va por la red de Docker (`api:10000`), igual que Caddy. Sin router, sin TLS, sin
      # DNS público. Para eso este servicio se une también a `prod_default` (bloque `networks:`
      # del final).
      #
      # ⚠️ `http://` acá es correcto y NO contradice que la llave deba viajar cifrada: el tramo
      # es una red interna de Docker, el mismo criterio con el que Caddy y el túnel hablan en
      # claro con `api:10000`. El guard que exige `https://` está en `install-service.js`, que
      # es el INSTALADOR de Windows — no corre en este contenedor.
      #
      # ⛔ VA ACÁ Y NO EN `feeds.env` A PROPÓSITO: ese archivo NO está versionado y no tiene
      # generador, así que el cambio sería invisible desde el repo y se perdería si alguien
      # lo regenera. `environment:` tiene precedencia sobre `env_file`, así que esta línea
      # gana sin tocar el archivo de secretos.
      #
      # ⚠️ EL PRECIO, DECIDIDO POR EL USUARIO EL 2026-09-23: mientras esto apunte a `md`,
      # **Railway —que HOY es producción— deja de recibir la venta viva** y su pantalla de
      # Tienda Live se congela. Se revierte comentando esta línea y recreando el contenedor.
      #
      # ⚠️ El otro contenedor con esta variable (`feeds-livefast`) la hereda de `feeds.env` y
      # NO la usa: sólo `live-tickets-poller.js` la lee en ejecución (verificado).
      STORE_INGEST_URL: http://api:10000/api/store/live/ingest
      POLL_SECONDS: "25"
      WINDOW_MINUTES: "5"
      ODS_HB_KEY: store_poller
      ODS_HB_MAX_MIN: "10"
      ODS_HB_IGNORE_ERROR: "1"
    command:
      - /bin/sh
      - -c
      - 'while :; do node database/importers/kepler/live-tickets-poller.js; echo "[$(date "+%F %T %Z")] poller cayó, reintento en 10s"; sleep 10; done'
    healthcheck:
      test: ["CMD", "/app/ops/ingest/health-lane.sh"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    labels: { autoheal: "true" }
    logging: { driver: json-file, options: { max-size: "50m", max-file: "3" } }
    # [VL.11.B2] `default` es `vl_default` (lo de siempre). `prod` es la red del stack de
    # producción, declarada externa al final — es lo que le deja resolver `api` por nombre
    # sin salir de la máquina.
    networks: [default, prod]

  # ═══ EL BRAZO DEL HEALTHCHECK ═══
  # Sin esto el HEALTHCHECK sólo PINTA un rótulo: en Docker standalone
  # `restart: unless-stopped` reacciona a que el proceso MUERA, y nada reacciona a
  # `unhealthy`. El 2026-09-04 `ods-live-hot` estuvo 15 h colgado (proceso vivo,
  # CPU 0.00 %, cero entrega) y el motor no movió un dedo.
  #
  # ACOTADO POR ETIQUETA a propósito: en modo `all` reiniciaría también `pg-ods`, y
  # reiniciar la base por un healthcheck ajeno es peor que la enfermedad.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ods-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"
      DOCKER_SOCK: /var/run/docker.sock
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }

volumes:
  # Nombre FIJO (sin prefijo de proyecto) para que el destino de la copia física de
  # VL.2b sea inequívoco: /var/lib/docker/volumes/pgvector-md-data/_data
  pgvector-md-data:
    name: pgvector-md-data

# -- [VL.11.B2] La red del stack de produccion, vista desde aca ---------------
# ⚠️ `external: true` = Compose NO la crea ni la borra; se engancha a la que `ops/prod` ya
# levanto. Si prod no esta arriba, este stack falla al arrancar con un mensaje claro -- que es
# preferible a que cree una red vacia con el mismo nombre y el poller no resuelva `api` sin
# que nadie entienda por que.
networks:
  prod:
    external: true
    name: prod_default
