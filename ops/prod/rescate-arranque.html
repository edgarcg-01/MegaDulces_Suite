<!-- `[RES.5]` AUTO-RESCATE DE ARRANQUE. Se inyecta justo antes de </body> en el index.html.

     ⭐ Por qué existe, medido el 2026-10-12: tras el deploy + la caída del servidor, en varios
        Android la app dejó de abrir. Incógnito SÍ abría; el navegador normal NO; y `?ngsw-bypass=true`
        TAMPOCO — o sea que NO era el service worker, era el ALMACENAMIENTO LOCAL del sitio.
        «Borrar datos de navegación» lo arreglaba, pero eso no se le pide a 100 personas.

     ⭐ Qué hace: si pasados 20 s la app NO montó, limpia SU PROPIO estado (caches, service workers,
        IndexedDB, localStorage) y recarga UNA sola vez. Es exactamente «borrar datos del sitio»,
        pero lo hace el teléfono solo y sólo cuando hace falta.

     ⛔ Lo que NO hace, a propósito:
        · No se ejecuta si la app montó bien — un usuario sano no pierde nada.
        · No entra en bucle: deja una marca en `sessionStorage`; si tras rescatar sigue fallando,
          NO vuelve a intentar y deja ver el error. Un rescate que se repite es una pantalla que
          parpadea para siempre y esconde la causa.
        · No toca nada del servidor.

     ⚠️ Costo declarado: `localStorage.clear()` borra la sesión, así que quien se rescata tiene que
        volver a entrar. Es el precio de que la app abra sola, y es el mismo que pagaba borrando
        datos a mano.

     ⚠️ 20 s y no menos: en 3G lento un arranque legítimo puede pasar de 10 s. Rescatar a alguien
        que sólo tenía red lenta le borraría la sesión sin motivo.

     ⚠️ Al cambiar este bloque hay que RECALCULAR el sha1 de `index.html` en `ngsw.json`
        (`hashTable["/index.html"]`), o el service worker lo ve corrupto. -->
<script>
(function () {
  var MARCA = 'md.rescate.v1';
  var ESPERA = 20000;

  // Si ya rescatamos en esta pestaña, no repetir: evita el bucle de recargas.
  try { if (sessionStorage.getItem(MARCA)) return; } catch (e) { /* modo privado: seguir */ }

  function montó() {
    var r = document.querySelector('app-root');
    return !!(r && r.children && r.children.length > 0);
  }

  function limpiarYRecargar() {
    try { sessionStorage.setItem(MARCA, String(Date.now())); } catch (e) {}

    var tareas = [];
    try {
      if (window.caches && caches.keys) {
        tareas.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (e) {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
    } catch (e) {}
    try {
      if (window.indexedDB && indexedDB.databases) {
        tareas.push(indexedDB.databases().then(function (ds) {
          return Promise.all((ds || []).map(function (d) {
            return new Promise(function (listo) {
              if (!d || !d.name) return listo();
              var rq = indexedDB.deleteDatabase(d.name);
              rq.onsuccess = rq.onerror = rq.onblocked = function () { listo(); };
            });
          }));
        }));
      }
    } catch (e) {}
    try { localStorage.clear(); } catch (e) {}

    var recargado = false;
    function recargar() {
      if (recargado) return;
      recargado = true;
      location.replace('/?rescate=' + Date.now());
    }
    // Cinturón: si alguna promesa se cuelga (IndexedDB bloqueada por otra pestaña), recargar igual.
    setTimeout(recargar, 6000);
    Promise.all(tareas).then(recargar, recargar);
  }

  function revisar() {
    setTimeout(function () { if (!montó()) limpiarYRecargar(); }, ESPERA);
  }

  if (document.readyState === 'complete') revisar();
  else window.addEventListener('load', revisar);
})();
</script>
