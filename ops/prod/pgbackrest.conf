; ─────────────────────────────────────────────────────────────────────────────
; [VL.9.6] pgBackRest para la base de producción on-prem.
;
; Repone lo que prod ya tiene en Railway y la copia de `md` no tenía: archivado
; continuo de WAL, o sea recuperación a un punto en el tiempo (RPO de minutos en
; vez de "la foto de anoche").
;
; ⚠️ Esto NO reemplaza al volcado diario de `prod-backup`. Son dos cosas distintas:
;    · `pg_dump` da un archivo portátil, que se puede restaurar en otra versión de
;      Postgres y del que se puede sacar UNA tabla. Es el que viaja.
;    · pgBackRest da recuperación a un punto en el tiempo del clúster ENTERO, y es
;      el único que sigue siendo viable cuando la base crece (con 340 GB un volcado
;      completo son ~12 h). No es portátil: restaura el mismo clúster.
;    La regla 3-2-1 pide las dos, y por ahora las dos viven en la MISMA máquina —
;    el "fuera de sitio" sigue abierto (VL.8).
; ─────────────────────────────────────────────────────────────────────────────

[global]
; El repositorio vive en una ruta del HOST (montada), no en un volumen de Docker:
; tiene que sobrevivir a un `docker compose down -v` y poder copiarse afuera sin
; pedirle permiso a Docker. Mismo criterio que la carpeta de volcados.
repo1-path=/var/lib/pgbackrest

; Retención. Dos completos + los diferenciales entre medio. Con 34 GB comprimidos
; con zstd son unos pocos GB por completo; hay 330 GB libres, así que el límite no
; es el disco sino cuánto pasado hace falta poder recuperar.
; ⚠️ El WAL se retiene atado a los respaldos: bajar `repo1-retention-full` BORRA el
;    WAL viejo y con él la ventana de recuperación de ese período.
repo1-retention-full=2
repo1-retention-diff=6

; Empaquetado y mapa de bloques: el primero junta los archivos chicos (una base con
; 1,251 tablas genera muchísimos), el segundo permite diferenciales a nivel de bloque.
repo1-bundle=y
repo1-block=y

; zstd sobre gzip: comprime parecido y cuesta bastante menos CPU, que acá es el
; recurso escaso (4 núcleos, compartidos con la ingesta).
compress-type=zst
compress-level=3

; 3 de 4 núcleos. Deja uno para que la ingesta y la app sigan respondiendo mientras
; corre un respaldo completo.
process-max=3

; Arranca el respaldo sin esperar al próximo checkpoint natural. Cuesta un pico de
; E/S y ahorra minutos de espera.
start-fast=y

; ⚠️ SÍNCRONO a propósito (sin `archive-async`). El asíncrono es más rápido pero
; reporta sus fallas en el archive-push SIGUIENTE, o sea que un problema se entera
; tarde. Con la carga de esta base (3 consultas activas) el síncrono alcanza; si
; algún día el WAL se acumula, ahí se enciende `archive-async=y` con su `spool-path`.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[prod]
pg1-path=/var/lib/postgresql/18/docker
