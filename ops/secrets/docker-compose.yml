# ─────────────────────────────────────────────────────────────────────────────
# Bóveda de secretos — Infisical self-host (INFRA.1, ADR-043)
#
# HOST = .249 (SISTEMAS) — mismo box que Jenkins/feeds/pgvector-md. Los secretos
# NO salen de tu infra. NO va en .245.
#
#   1. Generá los secretos del stack:
#        openssl rand -hex 16   → INFISICAL_ENCRYPTION_KEY   (32 chars hex)
#        openssl rand -hex 32   → INFISICAL_AUTH_SECRET      (base64/hex largo)
#      y ponelos en ops/secrets/.env (al lado de este archivo; NO commitear).
#   2. Levantar:
#        docker compose -f ops/secrets/docker-compose.yml up -d
#   3. UI: http://localhost:8222  → crear la cuenta admin + org + proyecto
#        "trade-marketing" con environments dev/staging/prod.
#
# NO exponer a internet directamente. Para que Railway (prod, nube) lea los
# secretos hay DOS caminos (ver README):
#   (a) Recomendado: NO exponer Infisical; usar el CLI/agente de Infisical para
#       SINCRONIZAR los secretos hacia Railway (push) desde .249. Railway sigue
#       leyendo de sus env vars normales; Infisical es la fuente de verdad.
#   (b) Exponer el API de Infisical por Cloudflare Tunnel detrás de Access y que
#       el runtime lo lea en boot (acopla el arranque a la disponibilidad de .249).
# ─────────────────────────────────────────────────────────────────────────────
services:
  infisical-db:
    image: postgres:16-alpine
    container_name: infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?seteá INFISICAL_DB_PASSWORD en ops/secrets/.env}
      POSTGRES_DB: infisical
    volumes:
      - infisical-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    volumes:
      - infisical-redis:/data

  infisical:
    image: infisical/infisical:latest-postgres
    container_name: infisical
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    ports:
      # UI + API. Solo LAN/VPN. 8222 para no chocar con Jenkins(8080)/glitchtip(8000).
      - "8222:8080"
    environment:
      NODE_ENV: production
      # TZ para alinear con el resto del stack on-prem.
      TZ: America/Mexico_City
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      # Generados con openssl (ver cabecera). SIN estos, no arranca.
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?openssl rand -hex 16}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?openssl rand -hex 32}
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8222}
      # Telemetría off (self-host privado).
      TELEMETRY_ENABLED: "false"

volumes:
  infisical-pg:
  infisical-redis:
