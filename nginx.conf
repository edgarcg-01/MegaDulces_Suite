server {
    listen $PORT;
    # Red privada de Railway (railway.internal) es IPv6-only: sin este listen,
    # portal/vendor apuntando a http://<api>.railway.internal:$PORT reciben
    # connection refused y el egress se queda en la URL pública (facturada).
    listen [::]:$PORT;
    server_name localhost;
    # pid/access/error logs redirigidos para que nginx corra como user non-root.
    # En Dockerfile asignamos /var/cache/nginx y /tmp con permisos del user.
    # HTTP/2 lo termina Railway en su edge router — el container sirve http/1.1
    # contra el edge, suficiente porque el cuello en 4G lenta es el wire.

    root /usr/share/nginx/html;
    index index.html;

    # Subida de fotos (ticket OCR, capturas): el default de nginx es 1 MB y
    # las fotos de celular pesan 2-5 MB → 413 antes de llegar al API. 32 MB
    # deja margen para PDFs combinados de comprobantes (hasta 20 MB → base64 ~27 MB
    # en el body JSON); los endpoints tienen su propio límite de body-parser.
    client_max_body_size 32m;

    # ── Buffers de header grandes ────────────────────────────────────────────
    # El JWT lleva un snapshot de permisos (record ~80 keys) + `rules` (CASL) para
    # gating de UI. Para superadmin (todos los permisos) el Authorization header
    # supera el default de nginx (8k) → nginx devolvía 400 a TODO /api antes de
    # pasarlo a Node (por eso 1ms y sin log de NestJS; el WS sí conectaba porque
    # manda el token en el payload, no en header). 32k deja amplio margen.
    # Fix de fondo: adelgazar el JWT (quitar `rules`, derivable en el cliente).
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    # ── Compresión gzip ─────────────────────────────────────────────────────
    # Sin esto el cold-start en 4G lenta bajaba 4MB. Con gzip level 6 sobre
    # JS/CSS/JSON/HTML el wire cae ~70-80%. Trade-off CPU mínimo en el server
    # (level 6 es el sweet spot; >6 da retornos marginales con CPU caro).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Headers de seguridad globales ───────────────────────────────────────
    # Helmet ya los pone para /api/* (responses del NestJS), pero el SPA
    # estático servido por nginx también los necesita.
    #
    # ⚠️ `[AU.33]` DECISIÓN ABIERTA, sin aplicar — la app NO se puede embeber a sí misma.
    # La vista previa de /admin/personas (ver la pantalla que se está concediendo) necesita que
    # la app se enmarque a sí misma. Hoy no puede: acá dice DENY y la CSP de abajo dice
    # `frame-ancestors 'none'`. Para habilitarla hacen falta DOS cambios juntos —acá SAMEORIGIN y
    # allá `'self'`— y los dos aflojan un header de seguridad, así que los decide una persona.
    # El delta real es ~cero: el clickjacking exige que te enmarque OTRO origen, y eso SAMEORIGIN
    # lo sigue prohibiendo igual que DENY; lo único que se habilita es enmarcarse a sí misma.
    # ⛔ Mientras no se cambie, el marco queda EN BLANCO sin tirar error. Por eso el componente lo
    # MIDE y lo declara en pantalla, en vez de quedarse mudo y leerse como «pantalla vacía».
    # Las apps `portal` y `vendor` se quedan en DENY pase lo que pase: ninguna se embebe.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `microphone=(self)`: sólo el propio origen, nunca terceros ni iframes.
    # Estaba en `()` —lista vacía = negado a TODOS, incluido el sitio mismo—
    # desde A.0bis.19 (2026-05-26), y eso es anterior al dictado por voz. O sea
    # que el asistente de caducidades y el dictado de Thot NUNCA funcionaron en
    # producción: la consola tiraba "Permissions policy violation: microphone is
    # not allowed in this document" y `getUserMedia` un `NotAllowedError`. En
    # local no se veía porque el dev server de Angular no manda esta cabecera.
    # El audio se graba en el navegador y se transcribe en NUESTRA API
    # (`/commercial/expiry-reviews/voice/transcribe`), así que no hace falta
    # abrir `connect-src` del CSP.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;
    # HSTS: forzar HTTPS por 1 año (Railway sirve por HTTPS por default).
    ${HSTS_LINE}
    # Server header — minimizar leak de versión
    server_tokens off;

    # ── SW + manifest: NO cachear (PRIMERO, antes del long-cache de .js) ────
    # nginx evalúa `location ~*` en orden de aparición, primer match gana.
    # `ngsw-worker.js` matchea también el patrón de assets hashed de abajo —
    # si éste bloque va segundo, se cachearía 1 año el SW y el cliente nunca
    # descubre nuevos deploys.
    location ~* (ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
        access_log off;
    }

    # ── Cache de assets hashed (long-lived) ─────────────────────────────────
    # Angular CLI genera `main-XXXXX.js`, `polyfills-XXXXX.js`, etc., con un
    # hash en el filename. Cuando cambia el código, cambia el hash → safe
    # cachear forever. Esto recorta el grueso de los 4MB del cold-start (los
    # 4,124 KiB de "efficient caching" en Lighthouse).
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repetimos los headers de seguridad porque `add_header` no hereda
        # cuando un location define los suyos (regla de nginx).
        add_header X-Content-Type-Options "nosniff" always;
        ${HSTS_LINE}
        access_log off;
        try_files $uri =404;
    }

    location / {
        # index.html SIEMPRE fresh — sino el cliente no descubre nuevos hashes
        # cuando deployamos. El resto del long-cache vive en los assets.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # `[AU.33]` Acá es donde de verdad se sirve el index.html: si alguna vez se habilita el
        # marco de la vista previa, ESTE es el header que hay que cambiar, no sólo el de arriba.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Igual que arriba. `add_header` NO se hereda en un location que declara
        # los suyos, así que esta es la copia que de verdad ve el index.html —
        # cambiar sólo la global no habría arreglado nada.
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;
        ${HSTS_LINE}
        # CSP del documento HTML. add_header NO se hereda en un location con sus
        # propios add_header → re-declaramos todo. Mapas (Leaflet OSM + Mapbox
        # static) en img-src; `script-src 'unsafe-inline'` por el onload inline de
        # fuentes en index.html. `frame-src`/`img-src` incluyen el bucket S3 privado
        # (t3.storageapi.dev, Railway/Tigris) para el visor lado-a-lado de comprobantes
        # (RE.8/RE.9): PDF en <iframe> + imagen legacy, ambos con URL prefirmada. Helmet cubre /api/* aparte.
        #
        # ⭐ `frame-src ... blob:` (2026-10-01) — REPORTADO: en `/compras/entradas` se sube un PDF
        # y al querer verlo "no deja, arroja un error".
        #
        # Esta línea estaba escrita para el comprobante YA GUARDADO —el del bucket, con URL
        # prefirmada—, que es lo que dice el comentario de arriba. Lo que nunca se consideró es la
        # PREVISUALIZACIÓN de lo que acabás de elegir, ANTES de mandarlo: ahí el visor arma un
        # `URL.createObjectURL(file)` y lo mete en el `<iframe>`, o sea `blob:`, que no estaba en
        # `frame-src` y el navegador rechaza.
        #
        # ⚠️ Y por eso llegó a producción sin que nadie lo viera: **en desarrollo no hay nginx**
        # (`nx serve` no manda ningún CSP), así que la previsualización funciona perfecto en la
        # máquina de quien la escribe y sólo falla servida. Es el mismo tipo de defecto invisible
        # que `check-docker-context` existe para atrapar.
        #
        # Riesgo: acotado. Un `blob:` lo crea NUESTRO propio JavaScript y es del mismo origen; no
        # se puede inyectar uno desde afuera. `img-src` y `worker-src` ya lo permitían — el que
        # NO se toca, y no hace falta, es `script-src`.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://t3.storageapi.dev https://*.t3.storageapi.dev https://api.mapbox.com https://*.tile.openstreetmap.org; frame-src 'self' blob: https://t3.storageapi.dev https://*.t3.storageapi.dev; connect-src 'self' https://api.mapbox.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; ${CSP_UPGRADE}" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para la API NestJS
    location /api/ {
        proxy_pass http://localhost:3333;
        proxy_http_version 1.1;
        # `Connection` se PASA de la peticion, no se fuerza a 'upgrade'.
        # Estaba hardcodeado: cada request REST (que no es un upgrade y no trae
        # cabecera Upgrade) le llegaba a Node anunciando un cambio de protocolo que
        # nunca ocurria. La conexion quedaba en limbo hasta agotar proxy_read_timeout
        # y salia un 504 — intermitente, porque depende de como se reusen las
        # conexiones keep-alive. Con el passthrough, un upgrade real manda
        # "Connection: Upgrade" y una peticion normal manda "keep-alive".
        # (Lo canonico es un `map $http_upgrade $connection_upgrade`, pero `map` va a
        # nivel http y este archivo es un unico bloque server inyectado como
        # sites-available/default.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Este bloque NO tenía timeouts, así que regía el default de nginx: 60 s.
        # Era el techo real de toda la API y la causa de los 504 "con el trabajo a
        # medias" (import del workbook, conciliación, motores de Maat, escaneos de
        # Contabilidad). Sube a 300 s para dar margen a lo que legítimamente tarda,
        # y `client_body_timeout` cubre lo que ningún job arregla: la RECEPCIÓN del
        # cuerpo (una foto de 10 MB en base64 desde una sucursal con uplink lento
        # puede tardar minutos antes de que NestJS vea el request).
        # No reemplaza el patrón 202 + WS: ese existe para que el usuario sepa el
        # resultado aunque cierre la pestaña. Esto sólo evita que el proxy corte
        # antes de que el trabajo termine.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # Proxy para WebSocket Socket.IO (namespace /reports)
    location /reports/socket.io/ {
        proxy_pass http://localhost:3333;
        proxy_http_version 1.1;
        # Mismo passthrough que en /api/: socket.io cae a LONG-POLLING cuando el
        # websocket no prospera, y esas son peticiones HTTP normales sin Upgrade.
        # Forzarles 'upgrade' las dejaba colgadas -> 502/504 y reconexion en bucle,
        # que es justo lo que se veia en consola (transport close -> connect_error
        # -> connected -> transport close...).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
