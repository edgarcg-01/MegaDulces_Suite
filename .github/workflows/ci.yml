name: CI

# Gate de build/typecheck. Compila las 4 apps deployables (api, view, portal,
# vendor) con la MISMA config que los Dockerfiles de prod (--configuration=
# production + --import load-compiler.mjs). Atrapa errores de TS / budgets de
# Angular ANTES de que Railway deploye un build roto — clave en este flujo
# single-dev con auto-push a main.
#
# NO publica imágenes: Railway construye desde el repo en cada push. Este job
# es puramente un gate de calidad.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Escaneo de secretos. Job SEPARADO del build (no lo bloquea). gitleaks-action
  # escanea solo los commits nuevos del push/PR (no revienta con el historial).
  # NOTA: si el repo es de una ORG, necesita un GITLEAKS_LICENSE (gratis, se
  # registra en gitleaks.io) como secret. Repos personales: no hace falta.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    name: Build & typecheck (api · view · portal · vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # El monorepo tiene puppeteer (deps del api). Sin esto npm ci baja
          # Chrome (~120MB) y puede colgarse. Mismo flag que los Dockerfiles.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          CI: 'true'

      - name: Build all deployables
        run: npx nx run-many -t build -p api view portal vendor --configuration=production --parallel=2
        env:
          NX_DAEMON: 'false'
          # Mismo arranque que los Dockerfiles: heap 4096 + @angular/compiler
          # precargado (Angular v18 + esbuild en Node 20 lo necesita).
          NODE_OPTIONS: "--max-old-space-size=4096 --import file://${{ github.workspace }}/load-compiler.mjs"

  # INFRA.5 (ADR-043): lint + test SOLO de lo que el cambio toca (nx affected).
  # Blast radius acotado: NO revienta por deuda de lint pre-existente en código
  # ajeno al PR/push. La regression suite (database/run-all-tests.js) NO va acá —
  # necesita API arriba + multi-DB sembrada; queda como gate local/manual.
  verify:
    name: Lint & test (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nx affected necesita el historial para el diff base↔head.

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Derivar SHAs base/head para affected
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          CI: 'true'

      - name: Lint (affected)
        run: npx nx affected -t lint --parallel=3
        env:
          NX_DAEMON: 'false'

      - name: Test (affected)
        run: npx nx affected -t test --parallel=3 --passWithNoTests
        env:
          NX_DAEMON: 'false'
