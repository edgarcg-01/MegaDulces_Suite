# ─────────────────────────────────────────────────────────────────────────────
# Jenkins on-prem — controlador único (JK.0)
#
# HOST = .249 (SISTEMAS, Windows 11 + Docker Desktop) — el box que HOY corre los
# feeds (Task Scheduler: Catalog/Nightly/Stock) y tiene Docker + pgvector-md(5433)
# + el stack de pruebas + Watchtower. NO va en .245 (ése es el box de consolidación
# Kepler; se deja intacto).
#
# Levantar:   docker compose -f jenkins/docker-compose.yml up -d
# Password:   docker exec trade-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
# UI:         http://localhost:8080   (NO exponer a internet — LAN/VPN only por ahora)
#
# NADA de network_mode: host (no existe en Docker Desktop/Windows). Los pipelines
# alcanzan las DBs por IP LAN (192.168.0.249:5433 / 192.168.0.245:5432) — tus
# Postgres ya escuchan en 0.0.0.0, así que un contenedor las ve por la IP de la LAN.
#
# El socket de Docker se monta para que Jenkins pueda lanzar agents en contenedores
# y construir/pushear la imagen del deploy (JK.2). Es privilegio fuerte → panel
# solo en LAN/VPN, nunca abierto a internet.
# ─────────────────────────────────────────────────────────────────────────────
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: trade-jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Duser.timezone=America/Mexico_City"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Docker Desktop expone el engine en este socket vía WSL2.
      - //var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
