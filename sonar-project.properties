# ═══════════════════════════════════════════════════════════════════════════════════════════
# `[SQ.0]` AUDITORÍA DE CÓDIGO — qué se mira, qué NO, y por qué
#
# Servidor: http://192.168.0.222:9000  (SOLO LAN — ver ops/sonar/docker-compose.yml)
#
# ── Qué es y qué NO es ────────────────────────────────────────────────────────────────────
# Es un INSTRUMENTO DE AUDITORÍA, no una compuerta. No bloquea merges y no lo va a hacer:
#   · La edición Community analiza **sólo la rama principal** — no hace análisis por rama ni
#     decora PRs (eso es Developer Edition, que se cobra por líneas de código; acá son ~790k).
#   · Y aunque se pudiera, este repo ya decidió lo contrario: el job `verify` del CI NO frena
#     a propósito, porque hoy está rojo por deuda preexistente y exigirlo dejaría a prod sin
#     despliegues. Una compuerta que se pone roja por deuda ajena enseña a ignorar el tablero.
#
# ⭐ El valor está en la TENDENCIA sobre `main` y en el código NUEVO ("Clean as You Code"),
#    que es el mismo criterio de ratchet que el repo ya usa en `scripts/lint-changed.js` y en
#    `scripts/lib/alcance-diff.js`. Lo viejo se MIDE y se muestra; no frena a nadie.
#
# ── Por qué las migraciones quedan FUERA ──────────────────────────────────────────────────
# ⛔ `database/migrations*` son **1,105 archivos** — el bloque más grande del repo — y son un
#    registro histórico append-only: knex valida `knex_migrations` contra el filesystem, así
#    que un archivo aplicado NO se toca ni se borra (ya costó un crash loop acá). Un hallazgo
#    ahí es por definición INACCIONABLE. Dejarlos dentro sería inflar el inventario con miles
#    de cosas que nadie puede arreglar, que es la forma más rápida de que nadie mire el resto.
#
# ⚠️ LA COBERTURA SALE EN 0% Y ESO NO ES LA COBERTURA — es que no se le pasó ningún reporte
#    (`sonar.javascript.lcov.reportPaths` está sin poner a propósito en esta primera pasada).
#    El repo tiene **348 smokes en `database/tests/` + 176 `*.spec.ts`**. Leer ese 0% como
#    "no hay pruebas" sería exactamente dibujar un cero sobre algo NO MEDIDO (ADR-056).
#    Cablear lcov de verdad es trabajo aparte, declarado y pendiente.
# ═══════════════════════════════════════════════════════════════════════════════════════════

sonar.projectKey=trade-marketing
sonar.projectName=Trade Marketing Suite
sonar.sourceEncoding=UTF-8

# El código de producto, más los carriles e importers (que son código real que corre en prod,
# aunque vivan bajo `database/`) y las compuertas de `scripts/`.
sonar.sources=apps,libs,database/importers,database/scripts,scripts,services,ops

# Los smokes viven en su propio directorio; los `.spec.ts` viven MEZCLADOS dentro de apps/libs,
# así que se marcan por patrón. Sonar aplica otras reglas a lo que es prueba — si quedaran como
# fuente, cada `expect()` sin aserción de tipo sería un hallazgo.
sonar.tests=database/tests
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/.nx/**,\
  **/coverage/**,\
  database/migrations/**,\
  database/migrations-newdb/**,\
  _imported/**,\
  apps/view/public/**
